<title>Nordhof</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze:wght@500;700&family=Work+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Leitstand: die Insel füllt den Bildschirm, dunkle Tafeln liegen darüber. Desktop zuerst: oben Kennzahlen, links Leiste und Ziele, rechts die Auswahl, unten die Bauleiste. Bewusst nur ein dunkler Look, damit die helle Insel heraussticht. */
:root{
  --bg:#172125; --bg2:#1B272B; --pn:rgba(23,33,37,.93); --card:#1F2C31; --card2:#25343A; --soft:rgba(241,236,226,.06); --soft2:rgba(241,236,226,.1);
  --line:rgba(241,236,226,.09); --tx:#F1ECE2; --mut:#A9B8BA; --mut2:#93A5A8;
  --gold:#E2B04A; --gold2:#F0C76A; --green:#8DB36B; --red:#D0583F; --red2:#E88A73; --sea:#6E929B;
  --display:'Grenze', 'Iowan Old Style', Georgia, serif;
  --body:'Work Sans', -apple-system, system-ui, 'Segoe UI', sans-serif;
  --tb:58px; --nav:0px; --rail:68px; --lw:var(--rail); --rw:0px; --mw:216px; --bb:0px;
  color-scheme: dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--body);font-size:14px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
img.ico{width:20px;height:20px;display:inline-block;vertical-align:middle;flex-shrink:0;pointer-events:none}
.i14{width:14px!important;height:14px!important}.i16{width:16px!important;height:16px!important}.i20{width:20px!important;height:20px!important}.i24{width:24px!important;height:24px!important}.i28{width:28px!important;height:28px!important}.i36{width:36px!important;height:36px!important}.i48{width:48px!important;height:48px!important}.i64{width:64px!important;height:64px!important}
#app{height:100%;position:relative;overflow:hidden}
#app.iopen{--rw:372px}
#app.lopen{--lw:calc(var(--rail) + 282px)}
.pn{background:var(--pn);border:1px solid var(--line);box-shadow:0 10px 30px rgba(8,14,16,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mut2)}
.num,.n,b{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(241,236,226,.14);border-radius:4px}::-webkit-scrollbar-track{background:transparent}

/* Karte */
#stage{position:absolute;inset:0;overflow:hidden;background:var(--sea)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(120% 90% at 50% 45%,transparent 60%,rgba(10,24,30,.28))}
#stage.placing #cv{cursor:crosshair}#stage.panning #cv{cursor:grabbing}

/* Obere Leiste */
#top{position:absolute;left:0;right:0;top:0;height:var(--tb);z-index:8;display:flex;align-items:center;gap:10px;padding:0 10px 0 8px;box-sizing:border-box;background:rgba(19,28,31,.95);border-bottom:1px solid var(--line);box-shadow:0 6px 20px rgba(8,14,16,.25)}
.hofb{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:12px;flex-shrink:0;min-width:0}
.hofb:hover{background:var(--soft)}
.hofb img{width:44px;height:40px;object-fit:contain}
.hofb .t{display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.hofb b,.hofb small{overflow:hidden;text-overflow:ellipsis}
.hofb b{font-family:var(--display);font-size:19px;line-height:1;white-space:nowrap}
.hofb small{font-size:11px;font-weight:600;color:var(--gold);white-space:nowrap}
.hofb .gbar{height:4px;border-radius:2px;background:var(--soft2);overflow:hidden;width:96px}
.hofb .gbar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.hofb.ready{box-shadow:inset 0 0 0 1.5px var(--gold);animation:glowg 1.8s ease-in-out infinite}
@keyframes glowg{50%{box-shadow:inset 0 0 0 1.5px var(--gold),0 0 14px rgba(226,176,74,.35)}}
.res{flex:1;min-width:0;display:flex;gap:4px;align-items:center;overflow:hidden;height:100%}
.chip{all:unset;cursor:pointer;display:grid;grid-template-columns:24px auto;grid-template-rows:auto auto;column-gap:5px;align-items:center;padding:4px 8px 4px 5px;border-radius:10px;flex-shrink:0;position:relative}
.chip:hover{background:var(--soft)}
.chip img{grid-row:1 / 3;width:24px;height:24px}
.chip b{font-size:14px;font-weight:800;line-height:1.05;white-space:nowrap}
.chip b small{font-size:10px;font-weight:600;color:var(--mut2)}
.chip .rt{font-size:10.5px;font-weight:700;line-height:1.1;color:var(--mut2);white-space:nowrap}
.chip .rt.up{color:var(--green)}.chip .rt.down{color:var(--red2)}
.chip .cb{position:absolute;left:6px;right:6px;bottom:1px;height:2px;border-radius:1px;background:var(--soft2);overflow:hidden}
.chip .cb i{display:block;height:100%;background:var(--green)}
.chip.full b{color:var(--red2)}.chip.full .cb i{background:var(--red2)}
.chip.bump img{animation:bump .4s ease-out}
@keyframes bump{35%{transform:scale(1.18)}}
.chip[hidden]{display:none}
.more{all:unset;cursor:pointer;flex-shrink:0;height:34px;padding:0 10px;border-radius:10px;background:var(--soft2);font-weight:800;font-size:12px;display:flex;align-items:center;gap:4px}
.more:hover{background:rgba(241,236,226,.16)}
.kp{display:flex;align-items:center;gap:2px;flex-shrink:0}
.k{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:10px;white-space:nowrap}
.k:hover{background:var(--soft)}
.k img{width:24px;height:24px}
.k .v{display:flex;flex-direction:column;line-height:1.05}
.k b{font-size:14px;font-weight:800}
.k small{font-size:10px;font-weight:600;color:var(--mut2)}
.pips{display:flex;gap:3px;margin-top:2px}
.pips i{width:8px;height:8px;border-radius:2px;background:var(--soft2)}
.pips i.on{background:var(--green)}.pips i.busy{background:var(--gold)}
.k.alarm{background:var(--red);animation:pulse 1.1s ease-in-out infinite}.k.alarm small{color:#FFE0D8}
@keyframes pulse{50%{transform:scale(1.05)}}
.k.off{opacity:.45}
.tseg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;flex-shrink:0}
.tseg button{border:none;background:none;border-radius:8px;min-width:32px;height:28px;font-weight:800;font-size:12px;cursor:pointer;color:var(--mut);display:grid;place-items:center}
.tseg button:hover{color:var(--tx)}
.tseg button.on{background:var(--gold);color:#1B272B}
.icon-btn{border:none;background:var(--soft);border-radius:10px;width:40px;height:36px;cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.icon-btn:hover{background:var(--soft2)}
.burger{width:16px;height:2px;background:var(--tx);border-radius:2px;box-shadow:0 5px 0 var(--tx),0 -5px 0 var(--tx)}
.pp{width:11px;height:12px;border-left:3.5px solid currentColor;border-right:3.5px solid currentColor;box-sizing:border-box}
.paused .pp,.tseg button.on .pp{border-color:currentColor}
#speedM{display:none}

/* Linke Leiste */
#rail{position:absolute;left:0;top:var(--tb);bottom:0;width:var(--rail);z-index:7;background:rgba(19,28,31,.95);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;box-sizing:border-box;overflow-y:auto;overflow-x:hidden}
#rail button{all:unset;cursor:pointer;width:58px;padding:6px 0 5px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--mut);position:relative;flex-shrink:0}
#rail button img{width:28px;height:28px;transition:transform .2s}
#rail button:hover{background:var(--soft);color:var(--tx)}
#rail button.on{background:rgba(226,176,74,.14);color:var(--gold)}
#rail button.locked{opacity:.38;cursor:default}
#rail button.locked::after{content:attr(data-hl);position:absolute;top:3px;right:6px;font-size:9px;font-weight:800;color:var(--gold);background:rgba(226,176,74,.16);border-radius:6px;padding:1px 4px}
#rail .sp{flex:1}
#rail .dot,.mnav .dot{position:absolute;top:2px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--bg);animation:pulse 1.1s infinite}

/* Linke Tafel: Ziel, Baumeister, Engpässe */
#left{position:absolute;left:calc(var(--rail) + 10px);top:calc(var(--tb) + 10px);width:272px;max-height:calc(100% - var(--tb) - 20px);z-index:6;border-radius:16px;overflow-y:auto;box-sizing:border-box;padding:12px 12px 14px;display:none}
#app.lopen #left{display:block}
.sec + .sec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sech{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.sech .lbl{flex:1}
.sech b{font-size:12px;color:var(--tx)}
.goal{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:3px 0}
.goal .gn{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:12.5px;font-weight:600}
.goal .gb{height:5px;border-radius:3px;background:var(--soft2);overflow:hidden}
.goal .gb i{display:block;height:100%;background:var(--gold);transition:width .4s}
.goal.ok .gb i{background:var(--green)}
.goal > b{font-size:12px;color:var(--gold)}.goal.ok > b{color:var(--green)}
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ghead img{width:46px;height:42px;object-fit:contain}
.ghead b{font-family:var(--display);font-size:19px;line-height:1}
.ghead small{display:block;font-size:11.5px;color:var(--mut)}
.job{display:flex;align-items:center;gap:6px;padding:5px 0}
.job + .job{border-top:1px solid var(--line)}
.job .jl{all:unset;display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer}
.job .jl img{width:34px;height:32px;object-fit:contain;flex-shrink:0}
.jn{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}.jn b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.jn small{font-size:11px;color:var(--mut)}
.rbtn{border:none;background:var(--gold);color:#1B272B;border-radius:999px;padding:3px 8px;font-weight:800;font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:3px;flex-shrink:0}
.job.free{color:var(--mut2);font-size:12px;font-weight:600;padding:7px 8px;border:1.5px dashed var(--line);border-radius:10px;margin-top:4px}
.job.free + .job.free{border-top:1.5px dashed var(--line)}
.warn{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:var(--soft);font-size:12px;font-weight:600;cursor:pointer;border:none;width:100%;text-align:left;color:var(--tx)}
.warn + .warn{margin-top:4px}
.warn img{width:26px;height:24px;object-fit:contain;flex-shrink:0}
.warn span{flex:1;min-width:0}
.warn small{display:block;color:var(--red2);font-weight:600;font-size:11px}
.warn.mild small{color:var(--gold)}
.calm-ok{font-size:12px;color:var(--green);font-weight:600;display:flex;gap:6px;align-items:center}

/* Rechte Tafel: Auswahl */
#insp{position:absolute;right:10px;top:calc(var(--tb) + 10px);bottom:10px;width:352px;z-index:6;border-radius:18px;overflow-y:auto;box-sizing:border-box;padding:14px;transform:translateX(calc(100% + 24px));transition:transform .28s cubic-bezier(.2,.9,.25,1)}
#app.iopen #insp{transform:none}
.ihead{display:flex;gap:10px;align-items:center}
.ihead .th{width:84px;height:76px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.ihead .t{flex:1;min-width:0}
.ihead h2{font-size:24px}
.itabs{display:flex;gap:4px;margin-top:12px;background:var(--soft);border-radius:12px;padding:3px}
.itabs button{flex:1;border:none;background:none;border-radius:9px;padding:6px 4px;font-weight:700;font-size:12.5px;color:var(--mut);cursor:pointer}
.itabs button.on{background:var(--card2);color:var(--tx);box-shadow:0 1px 0 rgba(255,255,255,.05)}
.lvl{display:flex;gap:4px;margin-top:6px;align-items:center}
.lvl i{width:9px;height:9px;transform:rotate(45deg);border-radius:2px;background:var(--soft2)}
.lvl i.on{background:var(--gold)}
.lvl i.cap{background:transparent;box-shadow:inset 0 0 0 1px rgba(241,236,226,.15)}
.tiers{display:flex;align-items:flex-end;gap:6px;margin-top:10px}
.tiers > div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border-radius:12px;background:var(--soft);min-width:0;text-align:center}
.tiers img{width:64px;height:58px;object-fit:contain}
.tiers small{font-size:10.5px;color:var(--mut);font-weight:600}
.tiers b{font-size:12px}
.tiers .now{background:rgba(226,176,74,.12);box-shadow:inset 0 0 0 1.5px rgba(226,176,74,.5)}
.tiers .lock{opacity:.5}

/* Bauleiste */
#build{position:absolute;left:calc(var(--lw) + 10px);max-width:calc(100% - var(--lw) - var(--rw) - var(--mw) - 10px);bottom:10px;z-index:6;border-radius:18px;box-sizing:border-box;padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.bcats{display:flex;gap:4px;align-items:center;min-width:0;overflow-x:auto;scrollbar-width:none}
.bcats::-webkit-scrollbar{display:none}
.bcats button{border:none;background:none;border-radius:10px;padding:6px 10px;font-weight:700;font-size:12.5px;color:var(--mut);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;flex-shrink:0}
.bcats button:hover{color:var(--tx);background:var(--soft)}
.bcats button.on{background:var(--soft2);color:var(--tx)}
.bcats .bkey{margin-left:auto;font-size:11px;color:var(--mut2);font-weight:600;white-space:nowrap;padding-left:8px}
@media (max-width:1399px){.bcats .bkey{display:none}}
.bcats .tgl{background:var(--gold);color:#1B272B}
.bcats .tgl:hover{background:var(--gold2);color:#1B272B}
kbd{font:700 10.5px/1 var(--body);background:var(--soft2);border-radius:4px;padding:2px 5px;color:var(--tx)}
.bcards{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scroll-snap-type:x proximity}
#build.closed .bcards{display:none}
.bc{all:unset;cursor:pointer;flex:0 0 132px;box-sizing:border-box;border-radius:14px;background:var(--card);border:1px solid var(--line);padding:6px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;scroll-snap-align:start}
.bc:hover{border-color:rgba(226,176,74,.55);background:var(--card2)}
.bc.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.bc .th{width:86px;height:70px;object-fit:contain}
.bc .nm{font-weight:700;font-size:12.5px;text-align:center;line-height:1.15}
.bc .costs{justify-content:center}
.bc.off{opacity:.5}.bc.off .th{filter:grayscale(.6)}
.bc.lock{opacity:.42;cursor:default}.bc.lock .th{filter:grayscale(1) brightness(.8)}
.bc .why{font-size:10.5px;font-weight:700;color:var(--red2);text-align:center}
.bc .why.g{color:var(--gold)}
.bc .fp{position:absolute;top:6px;right:7px;font-size:10px;font-weight:800;color:var(--mut2)}
.bc .ibtn{top:5px;left:5px}

/* Minikarte */
#mini{position:absolute;right:calc(var(--rw) + 10px);bottom:10px;width:196px;height:132px;z-index:6;border-radius:16px;overflow:hidden;padding:0;transition:right .28s cubic-bezier(.2,.9,.25,1)}
#mcv{width:100%;height:100%;display:block;cursor:pointer}

/* Platzieren */
#placebar{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--tb) + 12px);z-index:7;display:flex;align-items:center;gap:10px;border-radius:14px;padding:7px 8px 7px 10px;max-width:calc(100% - 24px);box-sizing:border-box}
#placebar img{width:40px;height:36px;object-fit:contain;flex-shrink:0}
#placebar .t{display:flex;flex-direction:column;min-width:0}
#placebar b{font-size:13px;white-space:nowrap}
#placebar small{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#placebar small.err{color:var(--red2)}#placebar small.ok{color:var(--green)}
#placebar .touch{display:none}

/* Tooltip */
#tip{position:absolute;z-index:9;pointer-events:none;border-radius:12px;padding:8px 10px;max-width:260px;font-size:12px;line-height:1.35;box-sizing:border-box}
#tip b{font-size:13px}
#tip .tr{display:flex;align-items:center;gap:5px;margin-top:3px;color:var(--mut)}
#tip .tr.bad{color:var(--red2)}#tip .tr.good{color:var(--green)}

#toasts{position:absolute;left:var(--lw);right:var(--rw);top:calc(var(--tb) + 10px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:9}
.toast{display:flex;align-items:center;gap:8px;background:rgba(19,28,31,.95);border:1px solid var(--line);color:var(--tx);padding:6px 12px 6px 8px;border-radius:999px;font-weight:600;font-size:13px;animation:tin .35s cubic-bezier(.2,1.4,.4,1) both, tout .4s ease-in 2.4s forwards;box-shadow:0 6px 18px rgba(0,0,0,.3);max-width:calc(100% - 24px);box-sizing:border-box}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
#paused{position:absolute;left:calc(var(--lw) + (100% - var(--lw) - var(--rw)) / 2);top:calc(var(--tb) + 12px);transform:translateX(-50%);z-index:6;background:rgba(19,28,31,.92);color:var(--gold);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:999px;pointer-events:none;border:1px solid rgba(226,176,74,.4)}
#app.placing #paused{display:none}
#fps{position:absolute;left:calc(var(--lw) + 10px);top:calc(var(--tb) + 10px);background:rgba(19,28,31,.85);color:#fff;font:600 11px/1 var(--body);padding:5px 7px;border-radius:7px;z-index:5}
#app.lopen #fps{left:calc(var(--rail) + 292px)}
#bhud{position:absolute;left:calc(var(--lw) + (100% - var(--lw) - var(--rw)) / 2);transform:translateX(-50%);bottom:calc(var(--bb) + 20px);z-index:7;display:flex;align-items:center;gap:8px;border-radius:16px;padding:8px 10px;width:min(420px, calc(100% - 24px));box-sizing:border-box}
#bhud .bh{display:flex;align-items:center;gap:6px}#bhud .bh:first-child{flex:1}#bhud .bar{flex:1;min-width:60px}#bhud .btn{padding:6px 10px}#bhud.over .btn{display:none}

/* Tafeln für Dorf, Waren, Hafen, Wehr, Raubzug, Chronik */
.panel{position:absolute;left:var(--rail);right:0;top:var(--tb);bottom:0;overflow-y:auto;background:var(--bg);box-sizing:border-box;z-index:6;padding:20px max(20px, calc((100% - 980px) / 2)) 28px}
.panel.enter > *{animation:up .3s cubic-bezier(.2,.9,.3,1) both}
.panel.enter > *:nth-child(2){animation-delay:.03s}.panel.enter > *:nth-child(3){animation-delay:.06s}.panel.enter > *:nth-child(n+4){animation-delay:.09s}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.ptitle{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ptitle h1{font-family:var(--display);font-size:34px;margin:0;line-height:1}
.ptitle p{margin:2px 0 0;color:var(--mut);font-size:13px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;margin:0;text-wrap:balance}
h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut2);margin:16px 0 8px;font-weight:700;display:flex;align-items:center;gap:6px}
.box > h3:first-child{margin-top:0}
.sub{color:var(--mut);font-size:13px;margin:3px 0 0;line-height:1.4}
.head{display:flex;align-items:center;gap:12px}
.head > .t{flex:1;min-width:0}
.x{border:none;background:var(--soft2);width:34px;height:34px;border-radius:50%;cursor:pointer;flex-shrink:0;display:grid;place-items:center;position:relative}
.x:hover{background:rgba(241,236,226,.18)}
.x::before,.x::after{content:"";position:absolute;width:13px;height:2px;background:var(--tx);border-radius:2px;transform:rotate(45deg)}
.x::after{transform:rotate(-45deg)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}

.por{border-radius:50%;flex-shrink:0}
.trader{display:flex;gap:12px;align-items:center;background:linear-gradient(160deg,#22363C,#1C2C31);border:1px solid var(--line);border-radius:16px;padding:12px}

.side{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}

.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.war{border:1px solid var(--line);border-radius:16px;padding:8px 6px;background:var(--card);min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;transition:transform .15s, border-color .15s, opacity .2s}
.war.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}

.war.off{opacity:.55}.war.off img.por{filter:grayscale(.8)}
.war.dead{opacity:.4}.war.dead img.por{filter:grayscale(1)}
.war .nm{font-weight:700;font-size:13px}

@keyframes shake{20%{transform:translateX(-5px) rotate(-2deg)}40%{transform:translateX(5px) rotate(2deg)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.dmg{position:absolute;top:4px;left:50%;color:var(--red2);font-weight:800;font-size:15px;animation:dmg 1s ease-out forwards;pointer-events:none}

.target{position:relative;border:1px solid var(--line);background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}

.sacks{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.runhead{display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px;position:relative;max-width:420px}
.cell{aspect-ratio:1;max-width:100%;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:default;padding:0;position:relative;transition:transform .15s}
.cell img{width:62%;height:62%}

.cell.loot::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--card)}
.cell.reveal{animation:flip .45s ease-out}
@keyframes flip{from{transform:rotateY(90deg)}}
.token{position:absolute;left:0;top:0;pointer-events:none;transition:transform .38s cubic-bezier(.3,1.3,.5,1);z-index:2}
.token img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 3px var(--bg),0 4px 10px rgba(0,0,0,.45);animation:bob 1.4s ease-in-out infinite;display:block}
@keyframes bob{50%{transform:translateY(-3px)}}
.stormbar{flex:1;height:10px;border-radius:5px;background:var(--soft2);overflow:hidden;min-width:50px}
.stormbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sea),var(--red));transition:width .4s}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:16px 8px;padding-bottom:6px}
.slot{aspect-ratio:1;max-width:100%;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;position:relative;background:var(--card)}

.slot.safe{border-color:#5E8794;background:#1F3238}
@keyframes popin{from{transform:scale(.4);opacity:0}}
.log{margin-top:8px;font-size:12px;line-height:1.45;color:var(--mut);min-height:34px}
.log p{margin:0}.log p:first-child{color:var(--tx);font-weight:600}
.fx{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:12;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;gap:8px;animation:fxin .35s cubic-bezier(.2,1.5,.4,1) both, fxout .35s ease-in 1.5s forwards;pointer-events:none;min-width:220px}

/* Fenster */

.chapcard p{font-size:15.5px;line-height:1.6;color:#D8DFE0;margin:0}

/* Handy und schmale Fenster */
.mnav,#fab,#mrow{display:none}
@media (max-width:1279px){
  :root{--mw:12px}
  #app:not(.iopen) {--mw:216px}
  #app.iopen #mini{display:none}
}
@media (max-width:1199px){
  #app.lopen.iopen #left{display:none}
  #app.lopen.iopen{--lw:var(--rail)}
}
@media (max-width:899px){
  #app,#app.iopen,#app.lopen,#app.lopen.iopen,#app:not(.iopen){--rail:0px;--rw:0px;--mw:0px;--lw:0px}
  #rail,#left,#mini,.tseg,#top .kp .kraid small,#top .kp .kbld small,#top .kp .kpop small,#top .kp .kcoin small{display:none!important}
  #top{height:auto;flex-wrap:wrap;padding:calc(env(safe-area-inset-top, 0px) + 6px) max(8px, env(safe-area-inset-right, 0px)) 8px max(8px, env(safe-area-inset-left, 0px));gap:6px;border-radius:0 0 16px 16px}
  .hofb{flex:1;padding:2px 6px 2px 2px}.hofb img{display:none}.hofb b{font-size:16px}.hofb .gbar{width:100%;min-width:60px}
  .k.off{display:none}.icon-btn{width:36px}
  #insp{visibility:hidden;transition:transform .28s cubic-bezier(.2,.9,.25,1),visibility 0s .28s}
  #app.iopen #insp{visibility:visible;transition:transform .28s cubic-bezier(.2,.9,.25,1)}
  .kp{gap:0}.k{padding:4px 5px;gap:4px}.k img{width:22px;height:22px}.k b{font-size:13px}
  .res{order:3;flex:1 1 100%;height:auto;gap:4px}
  .chip{flex:1 1 0;min-width:0;padding:4px 4px 4px 5px;background:var(--soft);border-radius:9px;grid-template-columns:20px auto}
  .chip img{width:20px;height:20px}.chip b{font-size:13px}.chip .rt{display:none}.chip b small{display:none}
  .more{height:auto;align-self:stretch;background:var(--gold);color:#1B272B;padding:0 9px}
  #speedM{display:grid;position:absolute;right:10px;top:calc(var(--tb) + 10px);z-index:6;width:44px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(19,28,31,.92);color:var(--tx);font-weight:800;font-size:13px;place-items:center;cursor:pointer}
  #speedM.paused{color:var(--gold)}
  .mnav{display:grid;position:absolute;left:0;right:0;bottom:0;z-index:8;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 6px calc(env(safe-area-inset-bottom, 0px) + 6px);background:rgba(19,28,31,.96);border-top:1px solid var(--line);box-sizing:border-box}
  .mnav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:700;color:var(--mut);position:relative;padding:2px 0;border-radius:10px}
  .mnav button img{width:28px;height:28px}
  .mnav button.on{color:var(--gold)}
  .mnav button.locked{opacity:.38}
  #fab{display:grid;position:absolute;right:12px;bottom:calc(var(--nav) + 14px);z-index:7;width:60px;height:60px;border-radius:50%;border:none;background:var(--gold);place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.4);cursor:pointer}
  #fab img{width:42px;height:38px;object-fit:contain}
  #app.iopen #fab,#app.bopen #fab,#app.placing #fab{display:none}
  #insp{left:0;right:0;top:auto;bottom:var(--nav);width:auto;max-height:min(62%, calc(100% - var(--tb) - var(--nav) - 10px));border-radius:20px 20px 0 0;transform:translateY(105%);padding:12px 14px 16px}
  #app.iopen #insp{transform:none}
  .ihead .th{width:64px;height:58px}.ihead h2{font-size:21px}
  #build{left:0;right:0;max-width:none;bottom:var(--nav);border-radius:20px 20px 0 0;max-height:62%;padding:10px 10px 12px;display:none}
  #app.bopen #build{display:flex}
  #build .bcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));overflow-y:auto;overflow-x:hidden}
  #build.closed .bcards{display:grid}
  .bc{flex:none;width:auto}
  .bcats .bkey{display:none}
  .panel{left:0;bottom:var(--nav);padding:14px 12px 20px}
  .ptitle h1{font-size:28px}
  #toasts{left:0;right:0}
  #paused{left:50%}
  #bhud{left:50%;bottom:calc(var(--nav) + 12px)}
  #placebar{top:auto;bottom:calc(var(--nav) + 12px)}
  #placebar .touch{display:flex;gap:6px}
  #placebar .desk{display:none}
  #fps{left:10px}
  .mcard.wide{flex-direction:column-reverse;justify-content:flex-end;overflow-y:auto}
  .hofR .head img{width:64px!important;height:58px!important}.hofR h2{font-size:26px!important}
  .hofL{width:auto;padding:18px}.hofR{padding:18px;overflow:visible}
  .chap h1{font-size:32px}
  .lpath span{width:30px;height:30px;font-size:15px}.lpath em{width:8px}
  .trow{grid-template-columns:24px 92px 1fr}
}
@media (max-width:899px) and (min-width:600px){.chip .rt{display:block}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div id="app" class="lopen">
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="paused" hidden>Angehalten</div>
    <div id="toasts"></div>
    <div id="fps" hidden>60 fps</div>
    <div id="tip" class="pn" hidden></div>
    <div id="placebar" class="pn" hidden></div>
    <button id="speedM" data-act="speed" aria-label="Tempo">1×</button>
  </main>
  <header id="top">
    <button class="hofb" id="hofB" data-act="hof" aria-label="Häuptlingshof"><img id="hofI" alt=""><span class="t"><b id="hofN">Hofstufe 1</b><small id="hofG">Ziel 0 von 0</small><span class="gbar"><i id="hofP"></i></span></span></button>
    <div class="res" id="res"></div>
    <div class="kp">
      <button class="k kpop" data-act="tab" data-t="dorf" aria-label="Einwohner"><img class="ico" id="moodI" data-icon="froh" alt=""><span class="v"><b id="popN">0</b><small>Einwohner</small></span></button>
      <button class="k kbld" data-act="left" aria-label="Baumeister"><img class="ico" data-icon="arbeit" alt=""><span class="v"><b id="bldN">2/2</b><span class="pips" id="bldP"></span></span></button>
      <button class="k kcoin" data-act="chip" data-k="muenzen" aria-label="Münzen"><img class="ico" data-icon="muenzen" alt=""><span class="v"><b data-r="muenzen">0</b><small>Münzen</small></span></button>
      <button class="k kraid" id="raidChip" data-act="tab" data-t="wehr" aria-label="Überfall"><img class="ico" data-icon="schiff" alt=""><span class="v"><b id="raidT">ruhig</b><small>Überfall</small></span></button>
    </div>
    <div class="tseg" id="tseg"><button data-act="setspeed" data-k="0" aria-label="Anhalten" title="Leertaste"><span class="pp"></span></button><button data-act="setspeed" data-k="1" title="Taste 1">1×</button><button data-act="setspeed" data-k="2" title="Taste 2">2×</button><button data-act="setspeed" data-k="4" title="Taste 3">4×</button><button data-act="setspeed" data-k="8" title="Taste 4">8×</button></div>
    <button class="icon-btn" data-act="menu" aria-label="Menü"><span class="burger"></span></button>
  </header>
  <nav id="rail" aria-label="Bereiche">
    <button data-act="tab" data-t="insel" class="on"><img class="ico" data-icon="haus" alt="">Insel</button>
    <button data-act="tab" data-t="dorf"><img class="ico" data-icon="leute" alt="">Dorf</button>
    <button data-act="tab" data-t="waren"><img class="ico" data-icon="lager" alt="">Waren</button>
    <button data-act="tab" data-t="handel"><img class="ico" data-icon="waage" alt="">Hafen</button>
    <button data-act="tab" data-t="wehr"><img class="ico" data-icon="schild" alt="">Wehr</button>
    <button data-act="tab" data-t="raub"><img class="ico" data-icon="schiff" alt="">Raubzug</button>
    <button data-act="tab" data-t="chronik"><img class="ico" data-icon="rune" alt="">Chronik</button>
    <span class="sp"></span>
    <button data-act="left" id="leftB" aria-label="Ziele und Baumeister"><img class="ico" data-icon="krone" alt="">Ziele</button>
  </nav>
  <aside id="left" class="pn"><section class="sec" id="goal"></section><section class="sec"><div class="sech"><img class="ico i16" data-icon="arbeit" alt=""><span class="lbl">Baumeister</span><b id="bldF"></b></div><div id="jobs"></div></section><section class="sec"><div class="sech"><img class="ico i16" data-icon="sturm" alt=""><span class="lbl">Engpässe</span></div><div id="warns"></div></section></aside>
  <aside id="insp" class="pn"></aside>
  <section id="build" class="pn"><div class="bcats" id="bcats"></div><div class="bcards" id="bcards"></div></section>
  <div id="mini" class="pn"><canvas id="mcv" aria-label="Minikarte"></canvas></div>
  <section id="panel" class="panel" hidden></section>
  <nav class="mnav" id="mnav" aria-label="Bereiche">
    <button data-act="tab" data-t="insel"><img class="ico" data-icon="haus" alt="">Insel</button>
    <button data-act="tab" data-t="dorf"><img class="ico" data-icon="leute" alt="">Dorf</button>
    <button data-act="hof" id="mHof"><img class="ico" id="mHofI" alt="">Hof</button>
    <button data-act="tab" data-t="wehr"><img class="ico" data-icon="schild" alt="">Wehr</button>
    <button data-act="tab" data-t="raub"><img class="ico" data-icon="schiff" alt="">Raubzug</button>
  </nav>
  <button id="fab" data-act="buildtoggle" aria-label="Bauen"><img id="fabI" alt=""></button>
  <div id="pop" class="pn" hidden></div>
</div>
<div id="modal" class="modal" hidden><div class="mcard" id="modalCard"></div></div>
