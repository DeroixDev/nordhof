<title>Nordhof</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze:wght@500;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: the island fills the whole screen; top bar, resources and tabs float over it without frames. Sheets and panels slide in between. Single daylight look by choice. */
:root{
  --linen:#ECE7DC; --paper:#F8F5EE; --card:#FFFDF8; --fjord:#22343A; --fjord-2:#53656B; --line:#D8D1C3;
  --falun:#9A3224; --moss:#5C7246; --sea:#7FA2AA; --amber:#C4862A; --gold:#E2B04A;
  --display:'Grenze', 'Iowan Old Style', Georgia, serif;
  --body:'Work Sans', -apple-system, system-ui, 'Segoe UI', sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--linen);color:var(--fjord);font-family:var(--body);font-size:14px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
img.ico{width:20px;height:20px;display:inline-block;vertical-align:middle;flex-shrink:0;pointer-events:none}
.i14{width:14px!important;height:14px!important}.i16{width:16px!important;height:16px!important}.i24{width:24px!important;height:24px!important}.i28{width:28px!important;height:28px!important}.i36{width:36px!important;height:36px!important}.i48{width:48px!important;height:48px!important}.i64{width:64px!important;height:64px!important}
#app{height:100%;position:relative;overflow:hidden;--toph:96px;--navh:80px}

.hud{position:absolute;left:0;right:0;top:0;z-index:7;pointer-events:none;padding:calc(env(safe-area-inset-top, 0px) + 8px) max(12px, env(safe-area-inset-right, 0px)) 14px max(12px, env(safe-area-inset-left, 0px));background:linear-gradient(rgba(34,52,58,.30),rgba(34,52,58,0))}
.hud > *{pointer-events:auto}
.paneled .hud{background:linear-gradient(var(--paper) 70%,rgba(248,245,238,0))}
.paneled .brand{color:var(--falun);text-shadow:none}
.top{display:flex;align-items:center;gap:6px}
.brand{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.5px;line-height:1;color:#FFF8E6;margin-right:auto;text-shadow:0 1px 3px rgba(20,30,35,.45)}
.pillbtn{display:flex;align-items:center;gap:5px;border:none;background:rgba(248,245,238,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 8px rgba(20,30,35,.16);border-radius:999px;padding:4px 10px 4px 6px;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;cursor:pointer;transition:transform .12s}
.pillbtn:active{transform:scale(.94)}
.raid.alarm{background:var(--falun);border-color:var(--falun);color:var(--paper);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.icon-btn{border:none;background:rgba(248,245,238,.88);box-shadow:0 2px 8px rgba(20,30,35,.16);border-radius:12px;width:36px;height:32px;cursor:pointer;display:grid;place-items:center;transition:transform .12s}
.icon-btn:active{transform:scale(.92)}
.burger{width:16px;height:2px;background:var(--fjord);border-radius:2px;box-shadow:0 5px 0 var(--fjord),0 -5px 0 var(--fjord)}

.strip{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;pointer-events:none}
.strip > *{pointer-events:auto}
.strip::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:3px;background:rgba(248,245,238,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:none;border-radius:999px;padding:2px 8px 2px 3px;font-size:12px;box-shadow:0 1px 4px rgba(20,30,35,.12);color:var(--fjord);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;cursor:pointer}
.chip.more{padding:2px 10px;font-weight:800}
.chip[hidden]{display:none}
.chip.full{color:var(--falun);box-shadow:inset 0 0 0 1.5px var(--falun)}
.chip.bump{animation:bump .4s ease-out}
@keyframes bump{35%{transform:scale(1.13)}}

#stage{position:absolute;inset:0;overflow:hidden;background:var(--sea)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.zoom{position:absolute;right:max(12px, env(safe-area-inset-right, 0px));top:calc(var(--toph) + 4px);display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:36px;height:36px;border-radius:50%;border:none;background:rgba(248,245,238,.88);box-shadow:0 2px 8px rgba(20,30,35,.16);color:var(--fjord);font-size:20px;font-weight:600;cursor:pointer;transition:transform .12s}
.zoom button:active{transform:scale(.9)}
#fps{position:absolute;left:12px;bottom:calc(var(--navh) + 8px);background:rgba(34,52,58,.8);color:#fff;font:600 11px/1 var(--body);padding:5px 7px;border-radius:7px;z-index:3;font-variant-numeric:tabular-nums}
#toasts{position:absolute;left:0;right:0;top:calc(var(--toph) + 4px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:6}
.toast{display:flex;align-items:center;gap:8px;background:rgba(34,52,58,.92);color:var(--paper);padding:7px 12px 7px 8px;border-radius:999px;font-weight:600;font-size:13px;animation:tin .35s cubic-bezier(.2,1.4,.4,1) both, tout .4s ease-in 2.2s forwards;box-shadow:0 6px 18px rgba(0,0,0,.2)}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}

.sheet{position:absolute;left:0;right:0;bottom:var(--navh);max-height:calc(64% - var(--navh) * .5);overflow-y:auto;background:var(--paper);border-top-left-radius:20px;border-top-right-radius:20px;box-shadow:0 -8px 28px rgba(20,30,35,.22);padding:10px 14px 16px;box-sizing:border-box;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);z-index:4}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.panel{position:absolute;inset:0;overflow-y:auto;background:var(--paper);padding:calc(var(--toph) + 8px) 14px calc(var(--navh) + 16px);box-sizing:border-box;z-index:5}
.panel.enter > *{animation:up .32s cubic-bezier(.2,.9,.3,1) both}
.panel.enter > *:nth-child(2){animation-delay:.03s}.panel.enter > *:nth-child(3){animation-delay:.06s}.panel.enter > *:nth-child(4){animation-delay:.09s}.panel.enter > *:nth-child(5){animation-delay:.12s}.panel.enter > *:nth-child(n+6){animation-delay:.15s}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;margin:0;text-wrap:balance}
h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--fjord-2);margin:16px 0 8px;font-weight:700;display:flex;align-items:center;gap:6px}
.sub{color:var(--fjord-2);font-size:13px;margin:3px 0 0;line-height:1.35}
.head{display:flex;align-items:center;gap:12px}
.head > .t{flex:1;min-width:0}
.x{border:none;background:var(--linen);width:32px;height:32px;border-radius:50%;cursor:pointer;flex-shrink:0;display:grid;place-items:center;transition:transform .12s;position:relative}
.x:active{transform:scale(.9)}
.x::before,.x::after{content:"";position:absolute;width:13px;height:2px;background:var(--fjord);border-radius:2px;transform:rotate(45deg)}
.x::after{transform:rotate(-45deg)}

.n{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.costs{display:flex;flex-wrap:wrap;gap:3px 7px;align-items:center}
.cost{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.cost.no{color:var(--falun)}
.cost.no img{filter:grayscale(.6) opacity(.7)}
.arrow{width:22px;height:12px;position:relative;display:inline-block;flex-shrink:0}
.arrow::before{content:"";position:absolute;left:0;right:6px;top:5px;height:2px;background:var(--fjord-2)}
.arrow::after{content:"";position:absolute;right:0;top:1px;border-left:8px solid var(--fjord-2);border-top:5px solid transparent;border-bottom:5px solid transparent}

.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.bcard{position:relative;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:transform .12s;min-width:0}
.bcard:active{transform:scale(.95)}
.bcard .th{width:84px;height:72px;object-fit:contain;max-width:100%}
.bcard .nm{font-weight:700;font-size:12px;text-align:center;line-height:1.15}
.bcard .costs{justify-content:center}
.bcard.off{opacity:.55}
.bcard.off .th{filter:grayscale(.7)}
.badge{position:absolute;top:5px;right:5px;display:inline-flex;align-items:center;gap:1px;background:var(--moss);color:#fff;border-radius:999px;padding:1px 6px 1px 2px;font-size:10px;font-weight:700}
.badge img{width:15px!important;height:15px!important}

.binfo{display:flex;gap:12px;align-items:center}
.binfo .th{width:96px;height:84px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.12))}
.pips{display:flex;gap:4px;margin-top:5px}
.pips i{width:10px;height:10px;transform:rotate(45deg);border-radius:2px;background:var(--line)}
.pips i.on{background:var(--gold);box-shadow:0 0 0 1px #A8761F inset}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;background:var(--linen);border-radius:14px;padding:10px 12px}
.bar{height:8px;border-radius:4px;background:rgba(0,0,0,.08);overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--moss);border-radius:4px;transition:width .35s}
.bar.red i{background:var(--falun)}
.bar.gold i{background:var(--amber)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:5px 8px;cursor:pointer;display:flex;align-items:center;gap:4px;font-weight:700;font-size:12px;transition:transform .12s}
.seg button:active{transform:scale(.93)}
.seg button.on{background:var(--fjord);color:var(--paper);border-color:var(--fjord)}
.btn{border:none;border-radius:12px;padding:9px 13px;background:var(--fjord);color:var(--paper);font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s, opacity .2s;flex-wrap:wrap}
.btn:active{transform:scale(.95)}
.btn.alt{background:var(--linen);color:var(--fjord)}
.btn.red{background:var(--falun)}
.btn.gold{background:var(--amber)}
.btn.small{padding:6px 9px;font-size:12px;border-radius:10px}
.btn.wide{width:100%;padding:12px}
.btn .cost{color:inherit}
.btn:disabled,.btn.off{opacity:.38;pointer-events:none}
.btn:focus-visible,.x:focus-visible,.tabs button:focus-visible,.cell:focus-visible,.bcard:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.note{font-size:12px;color:var(--fjord-2);line-height:1.4;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px 2px 4px;border-radius:999px;background:var(--linen);color:var(--fjord);font-weight:700}
.tag.red{background:var(--falun);color:var(--paper)}
.tag.green{background:var(--moss);color:var(--paper)}

.tabs{position:absolute;left:0;right:0;bottom:0;z-index:7;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px max(10px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 6px) max(10px, env(safe-area-inset-left, 0px));background:rgba(248,245,238,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 -4px 18px rgba(20,30,35,.14)}
.tabs button{border:none;background:none;border-radius:14px;padding:5px 2px 6px;font-weight:700;font-size:11px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .12s, background .2s}
.tabs button:active{transform:scale(.94)}
.tabs button img{width:28px;height:28px;transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
.tabs button.on{background:var(--fjord);color:var(--paper)}
.tabs button.on img{transform:translateY(-2px) scale(1.12)}
.tabs .dot{position:absolute;top:0;right:14%;width:12px;height:12px;border-radius:50%;background:var(--falun);border:2px solid var(--paper);animation:pulse 1.1s infinite}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.rtile{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.rtile .amt{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.rtile .row2{display:flex;gap:4px}
.hot{position:relative;display:inline-block}
.hot::after{content:"×2";position:absolute;top:-6px;right:-10px;background:var(--amber);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 5px}
.por{border-radius:50%;flex-shrink:0;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.trader{display:flex;gap:12px;align-items:center;background:linear-gradient(160deg,#DCE7E8,#C4D6D9);border-radius:18px;padding:12px}
.bubble{background:var(--card);border-radius:14px;padding:8px 10px;font-size:12px;position:relative;line-height:1.35;min-width:0}
.bubble::before{content:"";position:absolute;left:-7px;top:16px;border-right:8px solid var(--card);border-top:6px solid transparent;border-bottom:6px solid transparent}
.order{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 10px}
.order .flowi{display:flex;align-items:center;gap:6px;flex:1;min-width:0}

.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:linear-gradient(160deg,#E3E7E2,#D2DAD6);border-radius:18px;padding:12px}
.side{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.side .nm{font-weight:700;font-size:13px}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.vsx{font-family:var(--display);font-weight:700;font-size:28px;color:var(--falun)}
.meter{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--falun),var(--amber),var(--moss));position:relative;margin-top:12px}
.meter i{position:absolute;top:-4px;width:6px;height:18px;border-radius:3px;background:var(--fjord);transform:translateX(-50%);transition:left .6s cubic-bezier(.2,1.4,.4,1)}
.chron{display:flex;gap:6px;flex-wrap:wrap}
.chron div{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:4px 7px 4px 4px;font-size:11px;font-weight:700}

.crew{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.war{border:1px solid var(--line);border-radius:16px;padding:8px 6px;background:var(--card);min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;transition:transform .15s, border-color .15s, opacity .2s}
.war:active{transform:scale(.95)}
.war.sel{border-color:var(--fjord);border-width:2px;padding:7px 5px}
.war.sel::after{content:"";position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--moss);box-shadow:0 0 0 2px var(--card)}
.war.off{opacity:.55}
.war.off img.por{filter:grayscale(.8)}
.war.dead{opacity:.4}
.war.dead img.por{filter:grayscale(1)}
.war .nm{font-weight:700;font-size:13px}
.war .gear{display:flex;gap:2px}
.ico.no{opacity:.18;filter:grayscale(1)}
.war .stats{font-size:12px;gap:6px}
.war.hit{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-5px) rotate(-2deg)}40%{transform:translateX(5px) rotate(2deg)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.dmg{position:absolute;top:4px;left:50%;color:var(--falun);font-weight:800;font-size:15px;animation:dmg 1s ease-out forwards;pointer-events:none;text-shadow:0 1px 0 #fff}
@keyframes dmg{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-26px);opacity:0}}
.target{position:relative;border:1px solid var(--line);background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.target .scene{width:100%;height:auto;aspect-ratio:16/7;display:block;max-width:100%}
.target .info{display:flex;align-items:center;gap:8px;padding:8px 10px}
.target .info .t{flex:1;min-width:0}
.target .nm{font-weight:700;font-family:var(--display);font-size:19px}
.target.locked .scene{filter:grayscale(.85) brightness(.9)}
.lockover{position:absolute;left:0;right:0;top:0;aspect-ratio:16/7;display:grid;place-items:center}
.lockover img{filter:drop-shadow(0 3px 6px rgba(0,0,0,.3))}
.sacks{display:flex;gap:2px;align-items:center}

.runhead{display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px;position:relative}
.cell{aspect-ratio:1;max-width:100%;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:default;padding:0;position:relative;transition:transform .15s}
.cell img{width:62%;height:62%}
.cell.fog{background:linear-gradient(145deg,#C3CBC8,#AEB8B5);border-color:transparent}
.cell.fog::after{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 70%)}
.cell.near{cursor:pointer;border-color:var(--fjord);border-width:2px;animation:glow 1.6s ease-in-out infinite}
.cell.near:active{transform:scale(.93)}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(196,134,42,.35)}}
.cell.done img{opacity:.35;filter:grayscale(.6)}
.cell.loot::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--card)}
.cell.reveal{animation:flip .45s ease-out}
@keyframes flip{from{transform:rotateY(90deg)}}
.token{position:absolute;left:0;top:0;pointer-events:none;transition:transform .38s cubic-bezier(.3,1.3,.5,1);z-index:2}
.token img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 3px var(--paper),0 4px 10px rgba(0,0,0,.35);animation:bob 1.4s ease-in-out infinite;display:block}
@keyframes bob{50%{transform:translateY(-3px)}}
.stormbar{flex:1;height:10px;border-radius:5px;background:var(--linen);overflow:hidden;min-width:50px}
.stormbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sea),var(--falun));transition:width .4s}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:16px 8px;padding-bottom:6px}
.slot{aspect-ratio:1;max-width:100%;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;position:relative;background:var(--card)}
.slot.full{border-style:solid;animation:popin .35s cubic-bezier(.2,1.6,.4,1)}
.slot > img{width:58%;height:58%}
.slot .q{position:absolute;top:2px;right:5px;font-size:10px;font-weight:700}
.slot .acts{position:absolute;left:3px;right:3px;bottom:-9px;display:flex;justify-content:space-between}
.slot .acts button{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--paper);padding:0;display:grid;place-items:center;cursor:pointer}
.slot .acts button img{width:16px;height:16px}
.slot.safe{border-color:#3F5E6B;background:#E6EEF0}
@keyframes popin{from{transform:scale(.4);opacity:0}}
.log{margin-top:8px;font-size:12px;line-height:1.45;color:var(--fjord-2);min-height:34px}
.log p{margin:0}
.log p:first-child{color:var(--fjord);font-weight:600}

.fx{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:8;background:var(--paper);border-radius:20px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:8px;animation:fxin .35s cubic-bezier(.2,1.5,.4,1) both, fxout .35s ease-in 1.5s forwards;pointer-events:none;min-width:220px}
@keyframes fxin{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}}
@keyframes fxout{to{opacity:0;transform:translate(-50%,-60%) scale(.95)}}
.fx .ttl{font-family:var(--display);font-weight:700;font-size:26px}
.fx .row{display:flex;gap:10px;align-items:center}
.fx .who{position:relative;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700}
.fx .who b{color:var(--falun);font-size:13px}
.fx .enemy{animation:shake .5s .2s}

  const sm=a=>a.map((v,i)=>{const x=i%N,y=(i/N)|0;let s=0,c=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(inb(x+dx,y+dy)){s+=a[idx(x+dx,y+dy)];c++;}}return s/c;});
  const n1=sm(sm(base)), n2=sm(sm(base.map(()=>r()))), n3=sm(base.map(()=>r()));
  const tiles=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const i=idx(x,y),c=Math.hypot(x-MID,y-MID),d=c+(n1[i]-.5)*5,rg=regionOf(x,y,n1[i]);
    let t='water';
    if(d<12.8){
      const id=REG[rg].id,a=n2[i],b=n3[i];
      if(id==='heim'){t='grass';if(c>1.6){if(a>.56)t='forest';else if(b>.62)t='rock';}}
      else if(id==='taiga')t=a>.44?'forest':b>.66?'rock':'tundra';
      else if(id==='heide')t=a>.62?'forest':b>.7?'rock':'heide';
      else if(id==='moor')t=b>.6?'grass':a>.68?'forest':'moor';
      else if(id==='berg')t=a>.5?'berg':b>.45?'rock':'grass';
      else if(id==='duene')t=a>.62?'grass':'sand';

  }
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const T=tiles[idx(x,y)];if(T.t==='water'||T.t==='rock'||T.t==='berg')continue;if(N4.some(([dx,dy])=>!inb(x+dx,y+dy)||tiles[idx(x+dx,y+dy)].t==='water'))T.t='sand';}
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)tiles[idx(MID+dx,MID+dy)].t='grass';
  tiles[idx(MID-2,MID+1)].t='forest';tiles[idx(MID-2,MID+2)].t='forest';tiles[idx(MID-1,MID+2)].t='forest';
  tiles[idx(MID+2,MID-1)].t='rock';tiles[idx(MID+2,MID-2)].t='rock';
  return {tiles};
}

function load(){try{const raw=localStorage.getItem(SAVE);if(raw){const s=JSON.parse(raw);if(s&&s.v>=1&&s.v<=3)return migrate(s);}}catch(e){}return null;}
function migrate(s){
  for(const k in RES)if(typeof s.res[k]!=='number')s.res[k]=0;
  if(!s.pop)s.pop={n:BASEHOUSE,g:0,hunger:0};
  s.opt=Object.assign({fps:false,dn:'auto',eco:false,calm:false},s.opt);if(!s.started)s.started=s.t||now();
  if(s.v===1){s.res.fisch+=60;s.res.brot+=30;s.v=2;}
  if(s.v===2){
    /* 0.3 hatte eine 15er-Insel: alte Felder in die Mitte der neuen Welt legen */
    const g=genIsland(s.seed),on=Math.round(Math.sqrt(s.tiles.length)),off=MID-((on-1)>>1);
    s.tiles.forEach((o,k)=>{if(o.t==='water')return;const x=k%on+off,y=((k/on)|0)+off;if(!inb(x,y))return;const T=g.tiles[idx(x,y)];T.r=0;if(o.t==='sand'&&!o.b){if(!['grass','forest','rock'].includes(T.t))T.t='grass';return;}T.t=o.t;T.b=o.b;});
    s.tiles=g.tiles;s.open=[0];s.explore=null;delete s.radius;delete s.expand;s.v=3;

}
function save(){S.t=now();try{localStorage.setItem(SAVE,JSON.stringify(S));}catch(e){}}

/* ---------- Ableitungen ---------- */
function unlocked(i){return S.open.includes(S.tiles[i].r);}
const nowT=()=>S._simT||now();
function busy(b){return !!(b&&b.until&&b.until>nowT());}
function bTime(type,L){const d=B[type],bt=BT[type]||BTK[d.kind]||30;return Math.round(L?bt*Math.pow(2.4,L):bt);}
function builders(){let n=2;for(const T of S.tiles)if(T.b&&T.b.type==='bauhuette'&&!(T.b.job==='build'&&busy(T.b)))n++;return Math.min(5,n);}

function freeB(){return builders()-busyCount();}

function fmtDur(sec){sec=Math.max(0,Math.ceil(sec));if(sec<60)return sec+' s';const m=Math.floor(sec/60);if(m<60)return m+' min'+(m<10&&sec%60?' '+(sec%60)+' s':'');const h=Math.floor(m/60);return h+' h'+(m%60?' '+(m%60)+' min':'');}

/* Fertige Baustellen und Erkundungen abschließen */
function finishJobs(){

    if(b.job==='up')b.lvl++;const j=b.job;delete b.until;delete b.job;changed=true;
    if(LIVE){sparks(i);anim[i]=T0-250;toast('<img class="ico i24" src="'+thumb(b.type,b.lvl)+'" alt="">'+B[b.type].n+(j==='up'?' Stufe '+b.lvl:'')+' fertig');}
    else if(REPORT)REPORT.done.push([b.type,b.lvl]);});

    if(LIVE)toast(IC(REG[r].ic,'i24')+REG[r].n+' erkundet');else if(REPORT)REPORT.reg.push(r);}

let REPORT=null;
function jobsOf(b){const d=B[b.type];return d.jobs?d.jobs+b.lvl-1:0;}
function derive(){
  let lager=0,hp=0,dmg=0,house=BASEHOUSE,jobs=0,tax=0;const joy={};
  for(const T of S.tiles){if(!T.b||(T.b.job==='build'&&busy(T.b)))continue;const d=B[T.b.type],L=T.b.lvl;
    if(d.kind==='store')lager+=L;if(d.kind==='def'){hp+=(d.hp||0)*L;dmg+=(d.dmg||0)*L;}
    if(d.kind==='home')house+=d.cap*L;jobs+=jobsOf(T.b);
    if(d.kind==='joy'){joy[T.b.type]=(joy[T.b.type]||0)+L;if(d.tax)tax+=d.tax*L;}}
  D.cap=100+150*lager;D.hp=40+hp;D.dmg=4+dmg;D.house=house;D.jobs=jobs;D.joyB=joy;D.tax=tax;
  if(S.pop.n>house)S.pop.n=house;

}
/* Zufriedenheit: Grundwert plus Nahrung, Kleidung, Dorfleben. Bestimmt Arbeitstempo, Wachstum und Steuern. */
function mood(){
  const parts=[];let h=35;
  const foods=FOOD.filter(k=>S.res[k]>=1);
  if(!foods.length)parts.push(['sauer',-25,'Hunger']);
  else{parts.push([foods[0],15,'Nahrung']);if(foods.length>1)parts.push(['kaese',8*(foods.length-1),'Abwechslung']);}
  if(S.res.kleidung>=1)parts.push(['kleidung',10,'Kleidung']);
  const jb=D.joyB||{};
  for(const k in jb){const d=B[k];let v=d.joy*jb[k];if(d.uses&&!Object.keys(d.uses).every(r=>S.res[r]>=1))v=0;parts.push([k,Math.min(30,v),d.n+(v?'':' (kein Met)')]);}
  if(S.pop.n<D.house*.5&&D.house>BASEHOUSE)parts.push(['huette',-5,'Leere Häuser']);
  for(const p of parts)h+=p[1];
  D.h=Math.max(0,Math.min(100,h));D.parts=parts;
  D.staff=D.jobs?Math.min(1,S.pop.n/D.jobs):1;
  D.eff=D.staff*(.7+.6*D.h/100);
}
function bonus(i){
  const T=S.tiles[i],d=B[T.b.type];if(!d.adj)return 0;
  const x=i%N,y=(i/N)|0;let s=0;
  for(const[dx,dy]of N8){
    const xx=x+dx,yy=y+dy;
    if(!inb(xx,yy)){if(d.adj.t==='water')s+=d.adj.v;continue;}
    const U=S.tiles[idx(xx,yy)];
    if(d.adj.t&&U.t===d.adj.t&&!U.b)s+=d.adj.v;
    if(d.adj.b&&U.b&&U.b.type===d.adj.b)s+=d.adj.v;
  }
  return Math.min(s,d.adj.max);
}
function canPlace(type,i){
  const T=S.tiles[i],d=B[type],x=i%N,y=(i/N)|0;
  if(T.t==='water'||T.t==='berg'||T.b||!unlocked(i))return false;
  if(d.reg&&!d.reg.includes(REG[T.r].id))return false;
  if(d.max&&countType(type)>=d.max)return false;
  if(d.need==='peak')return N8.some(([dx,dy])=>inb(x+dx,y+dy)&&S.tiles[idx(x+dx,y+dy)].t==='berg');
  if(d.need==='coast')return T.t==='sand'||N4.some(([dx,dy])=>!inb(x+dx,y+dy)||S.tiles[idx(x+dx,y+dy)].t==='water');
  if(d.need==='rock')return T.t==='rock'||N8.some(([dx,dy])=>inb(x+dx,y+dy)&&S.tiles[idx(x+dx,y+dy)].t==='rock');
  return T.t!=='rock';
}
const capped=k=>RES[k].k==='roh'||RES[k].k==='ware';
function add(k,a){S.res[k]=(S.res[k]||0)+a;if(capped(k)&&S.res[k]>D.cap)S.res[k]=D.cap;}
function has(c){for(const k in c)if((S.res[k]||0)<c[k]-1e-9)return false;return true;}
function pay(c){for(const k in c)S.res[k]-=c[k];}
function upCost(b){const d=B[b.type],L=b.lvl,c={};for(const k in d.cost)c[k]=Math.ceil(d.cost[k]*Math.pow(1.7,L));if(L>=3)c.werkzeug=L-2;if(L>=5)c.silber=L-4;if(L>=7)c.rune=L-6;return c;}
function prodRate(i){const b=S.tiles[i].b,d=B[b.type];return d.rate*b.lvl*(1+bonus(i))*D.eff;}
function craftSpeed(i){const b=S.tiles[i].b;return b.lvl*(1+bonus(i))*D.eff;}

/* ---------- Simulation ---------- */
let LIVE=false;const popAcc={};
/* Flüsse je Rohstoff (pro Sekunde), gleitend gemittelt für die Statistik */
const FLOW={p:{},c:{}};let ACC={p:{},c:{}};
function gain(k,a){const b=S.res[k]||0;add(k,a);const d=Math.max(0,S.res[k]-b);ACC.p[k]=(ACC.p[k]||0)+d;return d;}
function use(k,a){const v=Math.min(a,S.res[k]||0);S.res[k]-=v;ACC.c[k]=(ACC.c[k]||0)+v;return v;}
function tick(dt){
  finishJobs();mood();
  S.tiles.forEach((T,i)=>{
    const b=T.b;if(!b||busy(b))return;const d=B[b.type];
    if(d.kind==='prod'){const a=prodRate(i)*dt,got=gain(d.out,a);if(LIVE&&got>0)popAcc[i]=(popAcc[i]||Math.random()*2)+got;return;}
    if(d.kind==='joy'&&d.uses){for(const k in d.uses)use(k,d.uses[k]*b.lvl*dt);return;}
    if(d.kind!=='craft')return;
    const key=b.recipe||d.rec[0],r=RECIPES[key];let time=dt*craftSpeed(i),guard=0;
    while(time>0&&guard++<500){
      if(!b.run){if(has(r.in)&&!(capped(key)&&S.res[key]>=D.cap)){for(const k in r.in)use(k,r.in[k]);b.run=1;}else break;}
      const need=r.t-b.prog;
      if(time>=need){time-=need;b.prog=0;b.run=0;gain(key,r.out);if(LIVE)popAt(i,key,r.out);}else{b.prog+=time;time=0;}
    }
  });
  people(dt);
  const a=1-Math.exp(-dt/20);
  for(const k in RES){FLOW.p[k]=(FLOW.p[k]||0)*(1-a)+(ACC.p[k]||0)/dt*a;FLOW.c[k]=(FLOW.c[k]||0)*(1-a)+(ACC.c[k]||0)/dt*a;}
  ACC={p:{},c:{}};
}
/* Einwohner essen, tragen Kleidung ab, zahlen Steuern und ziehen zu oder weg */
function people(dt){
  const P=S.pop,n=P.n;
  let need=n/60*dt;const foods=FOOD.filter(k=>S.res[k]>0);
  for(let q=0;q<3&&need>1e-9;q++){const fs=FOOD.filter(k=>S.res[k]>0);if(!fs.length)break;const each=need/fs.length;for(const k of fs)need-=use(k,each);}
  const fed=need<=1e-6;
  if(S.res.kleidung>0)use('kleidung',n/2400*dt);
  gain('muenzen',n*.025*(.5+D.h/100)*(1+D.tax)*dt);
  P.g+=dt;
  if(fed&&n<D.house&&D.h>=45){P.hunger=0;if(P.g>=8){P.n++;P.g=0;if(LIVE)toast(IC('leute','i24')+'Neue Einwohner: '+P.n);}}
  else if(!fed){P.hunger=Math.min(20,P.hunger+dt);if(P.hunger>=20&&n>3){P.n--;P.hunger=0;if(LIVE)toast(IC('sauer','i24')+'Hunger: jemand zieht weg');}P.g=0;}
  else P.g=Math.min(P.g,8);
  if(P.n>D.house)P.n=D.house;
  if(P.n!==n){D.staff=D.jobs?Math.min(1,P.n/D.jobs):1;villagersFit();}
}
function raiders(n){return{hp:Math.round(50*Math.pow(1.3,n)),dmg:Math.round(50*Math.pow(1.22,n))/10};}
function raidOutcome(win){
  const n=S.raid.n,out={win,coins:0,silber:0,lost:{}};
  if(win){out.coins=25*(n+1);out.silber=Math.random()<.35+n*.05?1+Math.floor(n/3):0;S.res.muenzen+=out.coins;S.res.silber+=out.silber;S.raid.n++;}
  else{for(const k in RES)if(capped(k)&&S.res[k]>0){const l=Math.floor(S.res[k]*.15);if(l>0){out.lost[k]=l;S.res[k]-=l;}}}
  S.raid.pending=false;S.raid.next=(S._simT||now())+15*60e3;
  S.raid.log.unshift({t:S._simT||now(),n,win,coins:out.coins,silber:out.silber});S.raid.log=S.raid.log.slice(0,8);
  return out;
}
function autoBattle(){
  const R=raiders(S.raid.n);let ih=D.hp,rh=R.hp,g=0;
  while(ih>0&&rh>0&&g++<200){rh-=D.dmg*rand(.85,1.15);if(rh<=0)break;ih-=R.dmg*rand(.85,1.15);}
  return raidOutcome(rh<=0);
}
function catchUp(ms){
  const before={...S.res},raids=[];let t=S.t;const end=S.t+Math.min(ms,8*3600e3);
  LIVE=false;REPORT={done:[],reg:[]};
  while(t<end){
    const step=Math.min(5000,end-t);S._simT=t;tick(step/1000);t+=step;
    if(!raids.length&&t>=S.raid.next&&!S.run){S._simT=S.raid.next;raids.push(autoBattle());}
  }
  S._simT=0;S.t=now();finishJobs();const done=REPORT.done,regs=REPORT.reg;REPORT=null;
  if(S.raid.next<S.t+60e3)S.raid.next=S.t+5*60e3;
  const gain={};for(const k in RES){const d=Math.floor(S.res[k]-before[k]);if(d)gain[k]=d;}
  return{ms,gain,raids,done,regs};

function rollBoat(){const ks=Object.keys(RES).filter(k=>capped(k));S.boat={k:pick(ks),until:now()+10*60e3};}

/* ---------- Raubzug ---------- */
function warStats(w){return{max:20+(w.ruestung?15:0),atk:4+(w.waffe?6:0)};}
function idx5(x,y){return y*5+x;}
function makeMap(diff){
  const cells=[];
  for(let i=0;i<30;i++)cells.push({t:wpick([['truhe',30],['feind',30],['grab',15],['leer',25]]),done:false,loot:[]});
  const ship=idx5(2,5);cells[ship]={t:'ship',done:true,loot:[]};
  let f;do{f=Math.floor(Math.random()*15);}while(f===idx5(2,0)&&diff===3);
  cells[f]={t:'feuer',done:false,loot:[]};
  if(diff===3)cells[idx5(2,0)]={t:'boss',done:false,loot:[]};

}
function lootItem(diff){const k=wpick(DIFF[diff].loot);return{k,a:k==='muenzen'?Math.round(rand(20,60)*diff):1};}
function bagCap(){return S.run.crew.filter(w=>w.hp>0).length*4;}
function runLog(s){S.run.log.unshift(s);S.run.log=S.run.log.slice(0,3);}
function itemName(it){return it.k==='muenzen'?it.a+' Münzen':RES[it.k].n;}
function giveLoot(items,cell){
  const got=[];
  for(const it of items){if(S.run.bag.length<bagCap()){S.run.bag.push(it);got.push(it);}else{cell.loot.push(it);runLog('Beutel voll, '+itemName(it)+' bleibt liegen.');}}
  if(got.length)toast(got.map(it=>IC(it.k,'i24')).join('')+' gefunden');

let fx=null;
function fight(kind){
  const R=S.run,base=DIFF[R.diff];
  const m=kind==='grab'?1.4:kind==='boss'?3:kind==='draugr'?1.2:1;
  const sc=R.step>base.storm?1+.15*(R.step-base.storm):1;
  let hp=base.hp*m*sc,atk=base.atk*(kind==='boss'?1.6:1)*sc,g=0;const dmg={};
  while(hp>0&&g++<100){
    const alive=R.crew.filter(w=>w.hp>0);if(!alive.length)break;
    hp-=alive.reduce((s,w)=>s+w.atk,0)*rand(.85,1.15);if(hp<=0)break;
    const w=pick(alive),h=atk*rand(.8,1.2);w.hp=Math.max(0,w.hp-h);dmg[w.n]=(dmg[w.n]||0)+h;
  }
  const fallen=R.crew.filter(w=>w.hp<=0&&!w.gone);fallen.forEach(w=>{w.gone=true;});
  const win=hp<=0;
  runLog((win?'Sieg gegen ':'Niederlage gegen ')+ENEMYN[kind]+'.'+(fallen.length?' Gefallen: '+fallen.map(w=>w.n).join(', ')+'.':''));
  fx={kind,win,dmg};
  while(R.bag.length>bagCap()){const it=R.bag.pop();runLog(itemName(it)+' geht verloren.');}
  return win;
}
function startRun(diff){
  const sel=S.crew.map((c,i)=>S.prep.sel[i]&&c.wounded<=now()?i:-1).filter(i=>i>=0);
  const need=sel.length+S.prep.extra;
  if(!sel.length||S.res.proviant<need)return;
  S.res.proviant-=need;
  const crew=sel.map(i=>{const c={n:S.crew[i].n,ci:i,waffe:S.res.waffe>0,ruestung:S.res.ruestung>0};if(c.waffe)S.res.waffe--;if(c.ruestung)S.res.ruestung--;const st=warStats(c);c.max=st.max;c.hp=st.max;c.atk=st.atk;return c;});
  S.run={diff,...makeMap(diff),crew,bag:[],safe:null,extra:S.prep.extra,step:0,log:[],over:null};
  runLog('Ihr landet. Das Schiff wartet am Strand.');
  lastTok=-1;render(true);
}
function move(i){
  const R=S.run;if(R.over)return;
  const px=R.pos%5,py=(R.pos/5)|0,x=i%5,y=(i/5)|0;
  if(Math.abs(px-x)+Math.abs(py-y)!==1)return;
  R.pos=i;R.step++;if(!R.seen.includes(i))R.seen.push(i);
  const c=R.cells[i],base=DIFF[R.diff];
  if(R.step===base.storm){runLog('Der Sturm zieht auf.');toast(IC('sturm','i24')+'Sturm! Jeder Schritt wird gefährlicher');}
  if(R.step>base.storm&&Math.random()<.25&&c.t!=='ship'){if(!fight('draugr'))return checkWipe();}
  if(!c.done){

const GCH=new Map();let gKey='';const CW=256;
function groundKey(){let h=0;for(let i=0;i<N*N;i++){const T=S.tiles[i];h=(h*31+(T.t.charCodeAt(0)+T.t.length*3+(T.b?T.b.type.length*7+(T.b.type.charCodeAt(0)<<3):0)+(unlocked(i)?1:0)))|0;}return h+'|'+dpr+'|'+(S.explore?S.explore.r:0);}
let gkT=0,gkV='';
let gZ=0,gZT=0;
function drawGround(){
  if(T0-gkT>250||!gkV){gkV=groundKey();gkT=T0;}
  if(gkV!==gKey){GCH.clear();gKey=gkV;}
  /* Kacheln in genau der Bildschirmauflösung: dann ist das Kopieren pixelgenau und billig.
     Während gezoomt wird, werden alte Kacheln skaliert weiterbenutzt und danach nach und nach erneuert. */
  const want=Math.min(4,dpr*view.z);if(want!==gZ){gZ=want;gZT=T0;}
  const settled=T0-gZT>160;let budget=settled?3:0;
  const x0=(-W/2-view.x)/view.z,x1=(W/2-view.x)/view.z,y0=(-H/2-view.y)/view.z,y1=(H/2-view.y)/view.z;
  const exact=want===dpr*view.z,ox=dpr*(W/2+view.x),oy=dpr*(H/2+view.y);

    const k=cx+','+cy;let e=GCH.get(k);
    if(!e||(e.sc!==want&&budget-->0)){e={c:chunk(cx,cy,want),sc:want};GCH.delete(k);GCH.set(k,e);if(GCH.size>40)GCH.delete(GCH.keys().next().value);}

    else{const pad=1/e.sc;ctx.drawImage(c,cx*CW-pad,cy*CW-pad,c.width/e.sc,c.height/e.sc);}
  }

    ctx.beginPath();ctx.moveTo(sx-TW/2+4,sy);ctx.lineTo(sx,sy-TH/2+2);ctx.lineTo(sx+TW/2-4,sy);ctx.lineTo(sx,sy+TH/2-2);ctx.closePath();ctx.stroke();ctx.restore();}

function chunk(cx,cy,sc){

    const[sx,sy]=tilePos(x,y);if(sx+60<X0||sx-60>X0+CW||sy+44<Y0||sy-26>Y0+CW)continue;list.push([x,y]);}
  if(!list.length)return null;

    if(w==='pop')t=S.pop.n;else if(w==='house')t=D.house;else if(w==='jobs')t=D.jobs;else if(w==='work')t=Math.min(S.pop.n,D.jobs);else if(w==='mood')t=Math.round(D.h)+' %';else if(w==='tax')t='+'+fmtN(S.pop.n*.025*(.5+D.h/100)*(1+D.tax)*60)+'/min';else if(w==='eff')t=Math.round(D.eff*100)+' %';else if(w==='eat')t='−'+fmtN(S.pop.n)+'/min';

function render(enter){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));

  if(tab==='insel'){p.hidden=true;renderSheet();}

  if(d.kind==='home')h+='<div class="flow">'+IC('leute','i36')+'<span class="n" style="font-size:18px">'+(d.cap?'+'+d.cap*b.lvl:BASEHOUSE)+'</span><span class="note" style="margin:0">Wohnplätze</span><span style="flex:1"></span><span class="n">'+IC('leute','i16')+'<span data-live="pop"></span>/<span data-live="house"></span></span></div>';

  h+='<div class="btns">'+(b.lvl<MAXLVL?'<button class="btn gold" style="flex:1"'+btnCost(upCost(b))+(freeB()>0?'':' data-block="1"')+' data-act="upgrade">'+IC('hoch','i16')+'Stufe '+(b.lvl+1)+' '+costHTML(upCost(b))+'<span class="cost">'+IC('uhr','i14')+fmtDur(bTime(b.type,b.lvl))+'</span></button>':'<span class="tag green">'+IC('krone','i16')+'Höchste Stufe</span><span style="flex:1"></span>')+
     '<button class="btn '+(demolishArm?'red':'alt')+' small" data-act="demolish" aria-label="Abreißen">'+IC('abriss','i24')+(demolishArm?'Sicher?':'')+'</button></div>';

}
function fmtN(v){return v>=100?String(Math.round(v)):v>=10?v.toFixed(0):v.toFixed(1).replace('.',',');}
function moodKey(){return D.h>=60?'froh':D.h>=40?'mittel':'sauer';}
const IB=info=>'<button class="ibtn" data-act="info" data-info="'+info+'" aria-label="Info">i</button>';
function reqOK(k){return !B[k].req||S.pop.n>=B[k].req;}
function miniStats(k){const d=B[k],a=[];
  if(d.kind==='home'&&d.cap)a.push('<span class="cost">'+IC('leute','i14')+'+'+d.cap+'</span>');
  if(d.jobs)a.push('<span class="cost">'+IC('arbeit','i14')+d.jobs+'</span>');
  if(d.kind==='joy')a.push('<span class="cost">'+IC('froh','i14')+'+'+d.joy+'</span>');
  if(d.out)a.push('<span class="cost">'+IC(d.out,'i14')+'</span>');
  if(d.rec)a.push(d.rec.map(r=>'<span class="cost">'+IC(r,'i14')+'</span>').join(''));
  return a.length?'<span class="costs mini">'+a.join('')+'</span>':'';}
function fmtRate(r){return(r*60).toFixed(r*60<10?1:0).replace('.',',')+'/min';}

let battle=null;
function openBattle(){
  if(!S.raid.pending||battle)return;
  const R=raiders(S.raid.n);

function battleRound(){
  const b=battle;if(!b||b.done)return;
  const m=b.boost?3:1;b.boost=0;const t=performance.now();
  const hit=D.dmg*rand(.85,1.15)*m;b.rh=Math.max(0,b.rh-hit);
  b.ev.push({k:'arrow',t,dmg:hit,fire:m>1});
  setTimeout(updBattleBars,450);

  const h=b.rd*rand(.85,1.15);b.ih=Math.max(0,b.ih-h);b.ev.push({k:'spear',t:t+520,dmg:h});
  setTimeout(updBattleBars,1000);

}
function updBattleBars(){const b=battle;if(!b)return;const a=$('#bIH'),c=$('#bRH');if(a){a.style.width=(b.ih/b.imax*100)+'%';$('#bIHn').textContent=Math.ceil(b.ih);}if(c){c.style.width=(b.rh/b.rmax*100)+'%';$('#bRHn').textContent=Math.ceil(b.rh);}}

function burst(g,x,y,e,col){const k=e/280;g.save();g.globalAlpha=Math.max(0,1-k);g.strokeStyle=col;g.lineWidth=3;g.lineCap='round';for(let i=0;i<8;i++){const a=i*TAU/8,r1=8+k*14,r2=r1+8;g.beginPath();g.moveTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);g.lineTo(x+Math.cos(a)*r2,y+Math.sin(a)*r2);g.stroke();}g.restore();}
function drawBattle(){

  g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=1.5;g.beginPath();for(let i=0;i<10;i++){const x=(i*61+t*.02)%(w+40)-20,y=h*.68+(i%3)*12;g.moveTo(x,y);g.quadraticCurveTo(x+6,y-3,x+12,y);}g.stroke();

/* Zeit vorspulen: alle Zeitpunkte rücken näher, der nächste Takt rechnet die Zeit nach wie nach einer Pause */
function timeWarp(ms){
  const sh=v=>v?v-ms:v;
  S.t-=ms;S.tiles.forEach(T=>{if(T.b&&T.b.until)T.b.until-=ms;});
  if(S.explore)S.explore.until-=ms;S.raid.next=sh(S.raid.next);if(S.raid.pending)S.raid.since-=ms;S.boat.until=sh(S.boat.until);
  S.crew.forEach(c=>{if(c.wounded)c.wounded-=ms;});if(S.started)S.started-=ms;
}
function devAct(d){
  const all=f=>{for(const k in RES)if(k!=='muenzen')f(k);};let msg='Erledigt';
  switch(d){
    case'res100':all(k=>S.res[k]+=100);break;case'res1000':all(k=>S.res[k]+=1000);break;
    case'resfull':all(k=>S.res[k]=Math.max(S.res[k],capped(k)?D.cap:999));break;case'res0':all(k=>S.res[k]=0);break;
    case'coin1k':S.res.muenzen+=1000;break;case'coin10k':S.res.muenzen+=10000;break;
    case'setres':{const k=$('#dvK').value,n=+$('#dvN').value;if(isFinite(n))S.res[k]=Math.max(0,n);msg=RES[k].n+' = '+fmt(S.res[k]);break;}
    case'setpop':{const n=+$('#dvP').value;if(isFinite(n))S.pop.n=Math.max(0,Math.floor(n));msg='Einwohner = '+S.pop.n;break;}
    case'fed':S.pop.hunger=0;break;case'heal':S.crew.forEach(c=>c.wounded=0);break;
    case'jobs':S.tiles.forEach(T=>{if(T.b&&T.b.until)T.b.until=now()-1;});if(S.explore)S.explore.until=now()-1;finishJobs();break;
    case'bld5':{let n=builders();for(let k=0;n<5&&k<S.tiles.length;k++){const T=S.tiles[k];if(T.t==='grass'&&!T.b&&unlocked(k)){T.b={type:'bauhuette',lvl:1,prog:0,run:0};n++;}}gkV='';break;}
    case'lvup':S.tiles.forEach(T=>{if(T.b&&T.b.lvl<MAXLVL&&!T.b.until)T.b.lvl++;});gkV='';break;
    case'lvmax':S.tiles.forEach(T=>{if(T.b&&!T.b.until)T.b.lvl=MAXLVL;});gkV='';break;
    case'open':S.open=REG.map((r,i)=>i);S.explore=null;gkV='';RCENT=regionCenters();break;
    case'close':S.open=[0];S.explore=null;gkV='';RCENT=regionCenters();break;
    case'w10':timeWarp(10*60e3);msg='10 Minuten vorgespult';break;case'w60':timeWarp(3600e3);msg='1 Stunde vorgespult';break;case'w480':timeWarp(8*3600e3);msg='8 Stunden vorgespult';break;
    case'raid':S.raid.next=now();break;case'noraid':S.raid.pending=false;S.raid.next=now()+3600e3;break;
    case'dn':S.opt.dn={auto:'tag',tag:'nacht',nacht:'auto'}[S.opt.dn||'auto'];applyOpt();break;
    case'jload':break;
    case'japply':{try{const o=JSON.parse($('#dvJ').value);if(!o||!o.tiles||!o.res)throw 0;S=migrate(o);vill.length=0;RCENT=regionCenters();gkV='';msg='Rohdaten übernommen';}catch(e){toast(IC('schloss','i24')+'Kein gültiger Spielstand');return;}break;}
  }
  derive();save();render();refresh();showMenu('dev');toast(IC('arbeit','i24')+msg);
}

    demolish(){if(B[S.tiles[sel].b.type].hidden)return;if(!demolishArm){demolishArm=true;renderSheet();return;}const b=S.tiles[sel].b,d=B[b.type];for(const k in d.cost)S.res[k]+=Math.floor(d.cost[k]/2);if(b.run&&b.recipe){const r=RECIPES[b.recipe];for(const k in r.in)S.res[k]+=r.in[k];}dust(sel);S.tiles[sel].b=null;demolishArm=false;derive();renderSheet();},
    recipe(){const b=S.tiles[sel].b;if(b.run){const r=RECIPES[b.recipe||B[b.type].rec[0]];for(const k in r.in)S.res[k]+=r.in[k];}b.recipe=el.dataset.k;b.run=0;b.prog=0;renderSheet();},
    sell(){const k=el.dataset.k,n=el.dataset.n==='all'?Math.floor(S.res[k]):Math.min(10,Math.floor(S.res[k]));if(n<=0)return;S.res[k]-=n;const c=n*price(k);S.res.muenzen+=c;toast(IC(k,'i24')+'−'+n+' '+IC('muenzen','i24')+'+'+c);render();},
    buy(){const k=el.dataset.k,c=RES[k].p*15;if(S.res.muenzen<c)return;S.res.muenzen-=c;add(k,5);toast(IC(k,'i24')+'+5');render();},
    order(){const j=+el.dataset.j,o=S.orders[j];if(!o||S.res[o.k]<o.a)return;S.res[o.k]-=o.a;S.res.muenzen+=o.rew;S.orders.splice(j,1);fillOrders();toast(IC('truhe','i24')+'Auftrag erledigt '+IC('muenzen','i24')+'+'+o.rew);render();},
    defend(){openBattle();},
    fire(){if(battle&&battle.fire){battle.fire=0;battle.boost=1;el.classList.add('off');}},
    closebattle(){battle=null;$('#modal').hidden=true;render();},
    closemodal(){$('#modal').hidden=true;},
    mpage(){showMenu(el.dataset.p);},
    opt(){const k=el.dataset.k;S.opt[k]=!S.opt[k];applyOpt();if(k==='eco'){resize();}save();showMenu(mPage);},
    dn(){S.opt.dn=el.dataset.v;applyOpt();save();showMenu(mPage);},
    dev(){devAct(el.dataset.d);},
    exp(){exportSave(el.dataset.how);},
    imp(){importSave($('#impTxt').value);},
    impfile(){const f=$('#impF');f.onchange=()=>{const file=f.files[0];if(!file)return;file.text().then(importSave);};f.click();},
    crew(){const i=+el.dataset.i;if(S.crew[i].wounded>now())return;S.prep.sel[i]=!S.prep.sel[i];render();},
    extra(){S.prep.extra=+el.dataset.n;render();},
    start(){prevHp={};runVis=null;startRun(+el.dataset.d);},
    move(){move(+el.dataset.i);},
    take(){const R=S.run,c=R.cells[R.pos],j=+el.dataset.j;if(R.bag.length>=bagCap())return;R.bag.push(c.loot.splice(j,1)[0]);render();},
    drop(){const R=S.run,j=+el.dataset.j;R.cells[R.pos].loot.push(R.bag.splice(j,1)[0]);render();},
    safe(){const R=S.run,j=+el.dataset.j;if(R.safe)return;R.safe=R.bag.splice(j,1)[0];render();},
    unsafe(){const R=S.run;if(!R.safe||R.bag.length>=bagCap())return;R.bag.push(R.safe);R.safe=null;render();},
    rest(){const R=S.run;if(R.extra<=0)return;R.extra--;R.step++;R.crew.forEach(w=>{if(w.hp>0)w.hp=Math.min(w.max,w.hp+10);});runLog('Rast am Feuer: alle +10.');toast(IC('herz','i24')+'Rast: alle +10');render();},
    extract(){const R=S.run,c=R.cells[R.pos];if(c.t!=='ship'&&c.t!=='feuer')return;endRun(true);save();render(true);},
    closerun(){S.run=null;render(true);},
    menu(){showMenu('main');},
    reset(){if(!resetArm){resetArm=true;el.textContent='Wirklich? Alles weg';el.classList.remove('alt');el.classList.add('red');return;}
      S=fresh();vill.length=0;for(const k in TREES)delete TREES[k];RCENT=regionCenters();derive();fillOrders();rollBoat();save();sel=-1;fitted=false;resize();$('#modal').hidden=true;tab='insel';render(true);}
  };
  if(A[a]){A[a]();save();}
});

document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click();}});
/* ---------- Start ---------- */
function boot(){
  document.querySelectorAll('img[data-icon]').forEach(im=>{im.src=iconURL(im.dataset.icon);});
  S=load();let rep=null;
  if(!S)S=fresh();
  else{S.opt=S.opt||{fps:false};derive();const gap=now()-S.t;if(gap>60e3)rep=catchUp(gap);}
  derive();fillOrders();if(!S.boat.until)rollBoat();RCENT=regionCenters();
  applyOpt();
  resize();updNight();render();save();
  if(rep&&(Object.keys(rep.gain).length||rep.raids.length||rep.done.length||rep.regs.length))showReport(rep);
  requestAnimationFrame(loop);
  setInterval(()=>{
    const t=now(),dt=(t-S.t)/1000;
    if(dt>60){const r=catchUp(t-S.t);if(Object.keys(r.gain).length||r.raids.length||r.done.length||r.regs.length)showReport(r);}
    else{LIVE=true;tick(dt);LIVE=false;S.t=t;}
    for(const i in popAcc){const T=S.tiles[i];if(!T.b||!B[T.b.type].out){delete popAcc[i];continue;}if(popAcc[i]>=3){const n=Math.floor(popAcc[i]);popAt(+i,B[T.b.type].out,n);popAcc[i]-=n;}}
    if(!S.raid.pending&&t>=S.raid.next&&!S.run){S.raid.pending=true;S.raid.since=t;toast(IC('schiff','i24')+'Plünderer in Sicht!');if(tab==='wehr')render();}
    if(S.raid.pending&&!battle&&t-S.raid.since>120e3){autoBattle();if(tab==='wehr')render();}
    if(tab==='handel'&&t>S.boat.until)render();
    document.querySelectorAll('[data-wound]').forEach(el=>{const c=S.crew[+el.dataset.wound];if(c.wounded<=t)render();else el.textContent=fmtT(c.wounded-t);});
    refresh();
  },1000);
  setInterval(save,5000);
  setInterval(updNight,60e3);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
  window.addEventListener('pagehide',save);
  {const ro=new ResizeObserver(()=>resize());ro.observe($('#stage'));ro.observe($('#hud'));}
}
boot();
})();
</script>
