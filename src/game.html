<title>Nordhof</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze:wght@500;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen game. Icon strip on top, framed island stage, icon tab bar below; sheets and panels slide over the stage. Single daylight look by choice. */
:root{
  --linen:#ECE7DC; --paper:#F8F5EE; --card:#FFFDF8; --fjord:#22343A; --fjord-2:#53656B; --line:#D8D1C3;
  --falun:#9A3224; --moss:#5C7246; --sea:#7FA2AA; --amber:#C4862A; --gold:#E2B04A;
  --display:'Grenze', 'Iowan Old Style', Georgia, serif;
  --body:'Work Sans', -apple-system, system-ui, 'Segoe UI', sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--linen);color:var(--fjord);font-family:var(--body);font-size:14px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
img.ico{width:20px;height:20px;display:inline-block;vertical-align:middle;flex-shrink:0;pointer-events:none}
.i14{width:14px!important;height:14px!important}.i16{width:16px!important;height:16px!important}.i24{width:24px!important;height:24px!important}.i28{width:28px!important;height:28px!important}.i36{width:36px!important;height:36px!important}.i48{width:48px!important;height:48px!important}.i64{width:64px!important;height:64px!important}
#app{height:100%;box-sizing:border-box;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:8px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

.top{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.5px;line-height:1;color:var(--falun);margin-right:auto}
.pillbtn{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px 4px 6px;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;cursor:pointer;transition:transform .12s}
.pillbtn:active{transform:scale(.94)}
.raid.alarm{background:var(--falun);border-color:var(--falun);color:var(--paper);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.icon-btn{border:1px solid var(--line);background:var(--paper);border-radius:12px;width:36px;height:32px;cursor:pointer;display:grid;place-items:center;transition:transform .12s}
.icon-btn:active{transform:scale(.92)}
.burger{width:16px;height:2px;background:var(--fjord);border-radius:2px;box-shadow:0 5px 0 var(--fjord),0 -5px 0 var(--fjord)}

.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;padding-bottom:2px}
.strip::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px 8px 3px 4px;font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;cursor:pointer}
.chip.full{border-color:var(--falun);color:var(--falun)}
.chip.bump{animation:bump .4s ease-out}
@keyframes bump{35%{transform:scale(1.13)}}

#stage{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;background:var(--sea);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:36px;height:36px;border-radius:12px;border:none;background:rgba(248,245,238,.9);font-size:20px;font-weight:600;cursor:pointer;transition:transform .12s}
.zoom button:active{transform:scale(.9)}
#fps{position:absolute;left:10px;bottom:10px;background:rgba(34,52,58,.8);color:#fff;font:600 11px/1 var(--body);padding:5px 7px;border-radius:7px;z-index:3;font-variant-numeric:tabular-nums}
#toasts{position:absolute;left:0;right:0;top:10px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:6}
.toast{display:flex;align-items:center;gap:8px;background:rgba(34,52,58,.92);color:var(--paper);padding:7px 12px 7px 8px;border-radius:999px;font-weight:600;font-size:13px;animation:tin .35s cubic-bezier(.2,1.4,.4,1) both, tout .4s ease-in 2.2s forwards;box-shadow:0 6px 18px rgba(0,0,0,.2)}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}

.sheet{position:absolute;left:0;right:0;bottom:0;max-height:64%;overflow-y:auto;background:var(--paper);border-top-left-radius:20px;border-top-right-radius:20px;box-shadow:0 -8px 28px rgba(20,30,35,.22);padding:10px 14px 16px;box-sizing:border-box;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);z-index:4}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.panel{position:absolute;inset:0;overflow-y:auto;background:var(--paper);padding:16px 14px 22px;box-sizing:border-box;z-index:5}
.panel.enter > *{animation:up .32s cubic-bezier(.2,.9,.3,1) both}
.panel.enter > *:nth-child(2){animation-delay:.03s}.panel.enter > *:nth-child(3){animation-delay:.06s}.panel.enter > *:nth-child(4){animation-delay:.09s}.panel.enter > *:nth-child(5){animation-delay:.12s}.panel.enter > *:nth-child(n+6){animation-delay:.15s}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;margin:0;text-wrap:balance}
h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--fjord-2);margin:16px 0 8px;font-weight:700;display:flex;align-items:center;gap:6px}
.sub{color:var(--fjord-2);font-size:13px;margin:3px 0 0;line-height:1.35}
.head{display:flex;align-items:center;gap:12px}
.head > .t{flex:1;min-width:0}
.x{border:none;background:var(--linen);width:32px;height:32px;border-radius:50%;cursor:pointer;flex-shrink:0;display:grid;place-items:center;transition:transform .12s;position:relative}
.x:active{transform:scale(.9)}
.x::before,.x::after{content:"";position:absolute;width:13px;height:2px;background:var(--fjord);border-radius:2px;transform:rotate(45deg)}
.x::after{transform:rotate(-45deg)}

.n{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.costs{display:flex;flex-wrap:wrap;gap:3px 7px;align-items:center}
.cost{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.cost.no{color:var(--falun)}
.cost.no img{filter:grayscale(.6) opacity(.7)}
.arrow{width:22px;height:12px;position:relative;display:inline-block;flex-shrink:0}
.arrow::before{content:"";position:absolute;left:0;right:6px;top:5px;height:2px;background:var(--fjord-2)}
.arrow::after{content:"";position:absolute;right:0;top:1px;border-left:8px solid var(--fjord-2);border-top:5px solid transparent;border-bottom:5px solid transparent}

.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.bcard{position:relative;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:transform .12s;min-width:0}
.bcard:active{transform:scale(.95)}
.bcard .th{width:84px;height:72px;object-fit:contain;max-width:100%}
.bcard .nm{font-weight:700;font-size:12px;text-align:center;line-height:1.15}
.bcard .costs{justify-content:center}
.bcard.off{opacity:.55}
.bcard.off .th{filter:grayscale(.7)}
.badge{position:absolute;top:5px;right:5px;display:inline-flex;align-items:center;gap:1px;background:var(--moss);color:#fff;border-radius:999px;padding:1px 6px 1px 2px;font-size:10px;font-weight:700}
.badge img{width:15px!important;height:15px!important}

.binfo{display:flex;gap:12px;align-items:center}
.binfo .th{width:96px;height:84px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.12))}
.pips{display:flex;gap:4px;margin-top:5px}
.pips i{width:10px;height:10px;transform:rotate(45deg);border-radius:2px;background:var(--line)}
.pips i.on{background:var(--gold);box-shadow:0 0 0 1px #A8761F inset}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;background:var(--linen);border-radius:14px;padding:10px 12px}
.bar{height:8px;border-radius:4px;background:rgba(0,0,0,.08);overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--moss);border-radius:4px;transition:width .35s}
.bar.red i{background:var(--falun)}
.bar.gold i{background:var(--amber)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:5px 8px;cursor:pointer;display:flex;align-items:center;gap:4px;font-weight:700;font-size:12px;transition:transform .12s}
.seg button:active{transform:scale(.93)}
.seg button.on{background:var(--fjord);color:var(--paper);border-color:var(--fjord)}
.btn{border:none;border-radius:12px;padding:9px 13px;background:var(--fjord);color:var(--paper);font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s, opacity .2s;flex-wrap:wrap}
.btn:active{transform:scale(.95)}
.btn.alt{background:var(--linen);color:var(--fjord)}
.btn.red{background:var(--falun)}
.btn.gold{background:var(--amber)}
.btn.small{padding:6px 9px;font-size:12px;border-radius:10px}
.btn.wide{width:100%;padding:12px}
.btn .cost{color:inherit}
.btn:disabled,.btn.off{opacity:.38;pointer-events:none}
.btn:focus-visible,.x:focus-visible,.tabs button:focus-visible,.cell:focus-visible,.bcard:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.note{font-size:12px;color:var(--fjord-2);line-height:1.4;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px 2px 4px;border-radius:999px;background:var(--linen);color:var(--fjord);font-weight:700}
.tag.red{background:var(--falun);color:var(--paper)}
.tag.green{background:var(--moss);color:var(--paper)}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex-shrink:0}
.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:5px 2px 6px;font-weight:700;font-size:11px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .12s, background .2s}
.tabs button:active{transform:scale(.94)}
.tabs button img{width:28px;height:28px;transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
.tabs button.on{background:var(--fjord);color:var(--paper);border-color:var(--fjord)}
.tabs button.on img{transform:translateY(-2px) scale(1.12)}
.tabs .dot{position:absolute;top:-3px;right:-3px;width:13px;height:13px;border-radius:50%;background:var(--falun);border:2px solid var(--linen);animation:pulse 1.1s infinite}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.rtile{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.rtile .amt{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.rtile .row2{display:flex;gap:4px}
.hot{position:relative;display:inline-block}
.hot::after{content:"×2";position:absolute;top:-6px;right:-10px;background:var(--amber);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 5px}
.por{border-radius:50%;flex-shrink:0;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.trader{display:flex;gap:12px;align-items:center;background:linear-gradient(160deg,#DCE7E8,#C4D6D9);border-radius:18px;padding:12px}
.bubble{background:var(--card);border-radius:14px;padding:8px 10px;font-size:12px;position:relative;line-height:1.35;min-width:0}
.bubble::before{content:"";position:absolute;left:-7px;top:16px;border-right:8px solid var(--card);border-top:6px solid transparent;border-bottom:6px solid transparent}
.order{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 10px}
.order .flowi{display:flex;align-items:center;gap:6px;flex:1;min-width:0}

.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:linear-gradient(160deg,#E3E7E2,#D2DAD6);border-radius:18px;padding:12px}
.side{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.side .nm{font-weight:700;font-size:13px}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.vsx{font-family:var(--display);font-weight:700;font-size:28px;color:var(--falun)}
.meter{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--falun),var(--amber),var(--moss));position:relative;margin-top:12px}
.meter i{position:absolute;top:-4px;width:6px;height:18px;border-radius:3px;background:var(--fjord);transform:translateX(-50%);transition:left .6s cubic-bezier(.2,1.4,.4,1)}
.chron{display:flex;gap:6px;flex-wrap:wrap}
.chron div{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:4px 7px 4px 4px;font-size:11px;font-weight:700}

.crew{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.war{border:1px solid var(--line);border-radius:16px;padding:8px 6px;background:var(--card);min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;transition:transform .15s, border-color .15s, opacity .2s}
.war:active{transform:scale(.95)}
.war.sel{border-color:var(--fjord);border-width:2px;padding:7px 5px}
.war.sel::after{content:"";position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--moss);box-shadow:0 0 0 2px var(--card)}
.war.off{opacity:.55}
.war.off img.por{filter:grayscale(.8)}
.war.dead{opacity:.4}
.war.dead img.por{filter:grayscale(1)}
.war .nm{font-weight:700;font-size:13px}
.war .gear{display:flex;gap:2px}
.ico.no{opacity:.18;filter:grayscale(1)}
.war .stats{font-size:12px;gap:6px}
.war.hit{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-5px) rotate(-2deg)}40%{transform:translateX(5px) rotate(2deg)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.dmg{position:absolute;top:4px;left:50%;color:var(--falun);font-weight:800;font-size:15px;animation:dmg 1s ease-out forwards;pointer-events:none;text-shadow:0 1px 0 #fff}
@keyframes dmg{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-26px);opacity:0}}
.target{position:relative;border:1px solid var(--line);background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.target .scene{width:100%;height:auto;aspect-ratio:16/7;display:block;max-width:100%}
.target .info{display:flex;align-items:center;gap:8px;padding:8px 10px}
.target .info .t{flex:1;min-width:0}
.target .nm{font-weight:700;font-family:var(--display);font-size:19px}
.target.locked .scene{filter:grayscale(.85) brightness(.9)}
.lockover{position:absolute;left:0;right:0;top:0;aspect-ratio:16/7;display:grid;place-items:center}
.lockover img{filter:drop-shadow(0 3px 6px rgba(0,0,0,.3))}
.sacks{display:flex;gap:2px;align-items:center}

.runhead{display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px;position:relative}
.cell{aspect-ratio:1;max-width:100%;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:default;padding:0;position:relative;transition:transform .15s}
.cell img{width:62%;height:62%}
.cell.fog{background:linear-gradient(145deg,#C3CBC8,#AEB8B5);border-color:transparent}
.cell.fog::after{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 70%)}
.cell.near{cursor:pointer;border-color:var(--fjord);border-width:2px;animation:glow 1.6s ease-in-out infinite}
.cell.near:active{transform:scale(.93)}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(196,134,42,.35)}}
.cell.done img{opacity:.35;filter:grayscale(.6)}
.cell.loot::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--card)}
.cell.reveal{animation:flip .45s ease-out}
@keyframes flip{from{transform:rotateY(90deg)}}
.token{position:absolute;left:0;top:0;pointer-events:none;transition:transform .38s cubic-bezier(.3,1.3,.5,1);z-index:2}
.token img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 3px var(--paper),0 4px 10px rgba(0,0,0,.35);animation:bob 1.4s ease-in-out infinite;display:block}
@keyframes bob{50%{transform:translateY(-3px)}}
.stormbar{flex:1;height:10px;border-radius:5px;background:var(--linen);overflow:hidden;min-width:50px}
.stormbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sea),var(--falun));transition:width .4s}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:16px 8px;padding-bottom:6px}
.slot{aspect-ratio:1;max-width:100%;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;position:relative;background:var(--card)}
.slot.full{border-style:solid;animation:popin .35s cubic-bezier(.2,1.6,.4,1)}
.slot > img{width:58%;height:58%}
.slot .q{position:absolute;top:2px;right:5px;font-size:10px;font-weight:700}
.slot .acts{position:absolute;left:3px;right:3px;bottom:-9px;display:flex;justify-content:space-between}
.slot .acts button{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--paper);padding:0;display:grid;place-items:center;cursor:pointer}
.slot .acts button img{width:16px;height:16px}
.slot.safe{border-color:#3F5E6B;background:#E6EEF0}
@keyframes popin{from{transform:scale(.4);opacity:0}}
.log{margin-top:8px;font-size:12px;line-height:1.45;color:var(--fjord-2);min-height:34px}
.log p{margin:0}
.log p:first-child{color:var(--fjord);font-weight:600}

.fx{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:8;background:var(--paper);border-radius:20px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:8px;animation:fxin .35s cubic-bezier(.2,1.5,.4,1) both, fxout .35s ease-in 1.5s forwards;pointer-events:none;min-width:220px}
@keyframes fxin{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}}
@keyframes fxout{to{opacity:0;transform:translate(-50%,-60%) scale(.95)}}
.fx .ttl{font-family:var(--display);font-weight:700;font-size:26px}
.fx .row{display:flex;gap:10px;align-items:center}
.fx .who{position:relative;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700}
.fx .who b{color:var(--falun);font-size:13px}
.fx .enemy{animation:shake .5s .2s}

.modal{position:fixed;inset:0;background:rgba(20,30,35,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));box-sizing:border-box;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.mcard{background:var(--paper);border-radius:22px;padding:18px;width:100%;max-width:420px;max-height:100%;overflow-y:auto;box-sizing:border-box;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#bcv{width:100%;height:180px;border-radius:14px;display:block;margin-top:12px;max-width:100%}
.hp2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.hp2 .s{display:flex;align-items:center;gap:6px}
.gains{display:flex;flex-wrap:wrap;gap:6px}
.gains div{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:4px 8px 4px 4px;font-weight:700;font-size:13px;animation:popin .4s cubic-bezier(.2,1.6,.4,1) both}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div id="app">

/* ---------- Spielstand ---------- */
let S, D={cap:100,hp:40,dmg:4};
function genIsland(seed){
  const r=rng(seed), base=[];
  for(let i=0;i<N*N;i++)base.push(r());
  const sm=a=>a.map((v,i)=>{const x=i%N,y=(i/N)|0;let s=0,c=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(inb(x+dx,y+dy)){s+=a[idx(x+dx,y+dy)];c++;}}return s/c;});
  const n1=sm(sm(base)), n2=sm(sm(base.map(()=>r()))), n3=sm(base.map(()=>r()));
  const tiles=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const i=idx(x,y), d=Math.hypot(x-MID,y-MID)+(n1[i]-.5)*6;
    let t='water';
    if(d<6.2){t='grass';const c=Math.hypot(x-MID,y-MID);if(c>1.6){if(n2[i]>.56)t='forest';else if(n3[i]>.62)t='rock';}}
    tiles.push({t,b:null});
  }
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const T=tiles[idx(x,y)];if(T.t==='water'||T.t==='rock')continue;if(N4.some(([dx,dy])=>!inb(x+dx,y+dy)||tiles[idx(x+dx,y+dy)].t==='water'))T.t='sand';}
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)tiles[idx(MID+dx,MID+dy)].t='grass';
  tiles[idx(MID-2,MID+1)].t='forest';tiles[idx(MID-2,MID+2)].t='forest';tiles[idx(MID-1,MID+2)].t='forest';
  tiles[idx(MID+2,MID-1)].t='rock';tiles[idx(MID+2,MID-2)].t='rock';
  let near=99;tiles.forEach((T,i)=>{if(T.t==='sand')near=Math.min(near,Math.hypot(i%N-MID,((i/N)|0)-MID));});
  return {tiles,radius:Math.min(5,Math.max(3.4,near+.6))};
}
function fresh(){
  const seed=Math.floor(Math.random()*1e9), g=genIsland(seed);
  const res={};for(const k in RES)res[k]=0;
  Object.assign(res,{holz:40,stein:20,muenzen:50,proviant:3});
  const s={v:1,seed,t:now(),res,tiles:g.tiles,radius:g.radius,expand:0,
    raid:{next:now()+12*60e3,n:0,pending:false,since:0,log:[]},
    boat:{k:'bretter',until:0},orders:[],crew:CREW.map(n=>({n,wounded:0})),
    run:null,wins:[0,0,0,0],prep:{sel:[true,true,false],extra:0},opt:{fps:false}};
  s.tiles[idx(MID,MID)].b={type:'holzfaeller',lvl:1,prog:0,run:0};
  s.tiles[idx(MID-1,MID+1)].b={type:'holzfaeller',lvl:1,prog:0,run:0};
  s.tiles[idx(MID+1,MID)].b={type:'feld',lvl:1,prog:0,run:0};

}
function load(){try{const raw=localStorage.getItem(SAVE);if(raw){const s=JSON.parse(raw);if(s&&s.v===1)return s;}}catch(e){}return null;}

/* ---------- Ableitungen ---------- */
function unlocked(i){return Math.hypot(i%N-MID,((i/N)|0)-MID)<=S.radius;}
function derive(){
  let lager=0,hp=0,dmg=0;
  for(const T of S.tiles){if(!T.b)continue;const d=B[T.b.type];if(d.kind==='store')lager+=T.b.lvl;if(d.kind==='def'){hp+=(d.hp||0)*T.b.lvl;dmg+=(d.dmg||0)*T.b.lvl;}}
  D.cap=100+150*lager;D.hp=40+hp;D.dmg=4+dmg;
  villagersFit();
}
function bonus(i){
  const T=S.tiles[i],d=B[T.b.type];if(!d.adj)return 0;
  const x=i%N,y=(i/N)|0;let s=0;
  for(const[dx,dy]of N8){
    const xx=x+dx,yy=y+dy;
    if(!inb(xx,yy)){if(d.adj.t==='water')s+=d.adj.v;continue;}
    const U=S.tiles[idx(xx,yy)];
    if(d.adj.t&&U.t===d.adj.t&&!U.b)s+=d.adj.v;
    if(d.adj.b&&U.b&&U.b.type===d.adj.b)s+=d.adj.v;
  }
  return Math.min(s,d.adj.max);
}
function canPlace(type,i){
  const T=S.tiles[i],d=B[type],x=i%N,y=(i/N)|0;
  if(T.t==='water'||T.b||!unlocked(i))return false;
  if(d.need==='coast')return T.t==='sand'||N4.some(([dx,dy])=>!inb(x+dx,y+dy)||S.tiles[idx(x+dx,y+dy)].t==='water');
  if(d.need==='rock')return T.t==='rock'||N8.some(([dx,dy])=>inb(x+dx,y+dy)&&S.tiles[idx(x+dx,y+dy)].t==='rock');
  return T.t!=='rock';
}
const capped=k=>RES[k].k==='roh'||RES[k].k==='ware';
function add(k,a){S.res[k]=(S.res[k]||0)+a;if(capped(k)&&S.res[k]>D.cap)S.res[k]=D.cap;}
function has(c){for(const k in c)if((S.res[k]||0)<c[k]-1e-9)return false;return true;}
function pay(c){for(const k in c)S.res[k]-=c[k];}
function upCost(b){const d=B[b.type],L=b.lvl,c={};for(const k in d.cost)c[k]=Math.ceil(d.cost[k]*Math.pow(1.7,L));if(L>=2)c.werkzeug=L-1;if(L>=3)c.silber=L-2;return c;}
function prodRate(i){const b=S.tiles[i].b,d=B[b.type];return d.rate*b.lvl*(1+bonus(i));}
function craftSpeed(i){const b=S.tiles[i].b;return b.lvl*(1+bonus(i));}

/* ---------- Simulation ---------- */
let LIVE=false;const popAcc={};
function tick(dt){
  S.tiles.forEach((T,i)=>{
    const b=T.b;if(!b)return;const d=B[b.type];
    if(d.kind==='prod'){const a=prodRate(i)*dt,before=S.res[d.out];add(d.out,a);if(LIVE&&S.res[d.out]>before)popAcc[i]=(popAcc[i]||Math.random()*2)+a;return;}
    if(d.kind!=='craft')return;
    const key=b.recipe||d.rec[0],r=RECIPES[key];let time=dt*craftSpeed(i),guard=0;
    while(time>0&&guard++<500){
      if(!b.run){if(has(r.in)&&!(capped(key)&&S.res[key]>=D.cap)){pay(r.in);b.run=1;}else break;}
      const need=r.t-b.prog;
      if(time>=need){time-=need;b.prog=0;b.run=0;add(key,r.out);if(LIVE)popAt(i,key,r.out);}else{b.prog+=time;time=0;}
    }
  });
}
function raiders(n){return{hp:Math.round(50*Math.pow(1.3,n)),dmg:Math.round(50*Math.pow(1.22,n))/10};}
function raidOutcome(win){
  const n=S.raid.n,out={win,coins:0,silber:0,lost:{}};
  if(win){out.coins=25*(n+1);out.silber=Math.random()<.35+n*.05?1+Math.floor(n/3):0;S.res.muenzen+=out.coins;S.res.silber+=out.silber;S.raid.n++;}
  else{for(const k in RES)if(capped(k)&&S.res[k]>0){const l=Math.floor(S.res[k]*.15);if(l>0){out.lost[k]=l;S.res[k]-=l;}}}
  S.raid.pending=false;S.raid.next=(S._simT||now())+15*60e3;
  S.raid.log.unshift({t:S._simT||now(),n,win,coins:out.coins,silber:out.silber});S.raid.log=S.raid.log.slice(0,8);
  return out;
}
function autoBattle(){
  const R=raiders(S.raid.n);let ih=D.hp,rh=R.hp,g=0;
  while(ih>0&&rh>0&&g++<200){rh-=D.dmg*rand(.85,1.15);if(rh<=0)break;ih-=R.dmg*rand(.85,1.15);}
  return raidOutcome(rh<=0);
}
function catchUp(ms){
  const before={...S.res},raids=[];let t=S.t;const end=S.t+Math.min(ms,8*3600e3);
  LIVE=false;
  while(t<end){
    const step=Math.min(5000,end-t);S._simT=t;tick(step/1000);t+=step;
    if(!raids.length&&t>=S.raid.next&&!S.run){S._simT=S.raid.next;raids.push(autoBattle());}
  }
  S._simT=0;S.t=now();
  if(S.raid.next<S.t+60e3)S.raid.next=S.t+5*60e3;
  const gain={};for(const k in RES){const d=Math.floor(S.res[k]-before[k]);if(d)gain[k]=d;}
  return{ms,gain,raids};
}
function rollBoat(){const ks=Object.keys(RES).filter(k=>capped(k));S.boat={k:pick(ks),until:now()+10*60e3};}
function producible(){
  const set=new Set(['holz']);
  for(const T of S.tiles){if(!T.b)continue;const d=B[T.b.type];if(d.out)set.add(d.out);if(d.rec)d.rec.forEach(r=>set.add(r));}
  return [...set].filter(k=>k!=='waffe'&&k!=='ruestung');
}
function newOrder(){

let fx=null;
function fight(kind){

  const sc=R.step>base.storm?1+.15*(R.step-base.storm):1;

  if(R.step>base.storm&&Math.random()<.25&&c.t!=='ship'){if(!fight('draugr'))return checkWipe();}
  if(!c.done){
    c.done=true;
    if(c.t==='truhe')giveLoot([lootItem(R.diff)].concat(Math.random()<.4?[lootItem(R.diff)]:[]),c);
    else if(c.t==='feind'){if(fight('feind')&&Math.random()<.5)giveLoot([lootItem(R.diff)],c);}
    else if(c.t==='grab'){if(fight('grab'))giveLoot([lootItem(R.diff),lootItem(R.diff)],c);}
    else if(c.t==='boss'){if(fight('boss'))giveLoot([{k:'rune',a:1},{k:'silber',a:1},{k:'silber',a:1},lootItem(3),lootItem(3)],c);}
    else if(c.t==='leer'){if(Math.random()<.3){R.crew.forEach(w=>{if(w.hp>0)w.hp=Math.min(w.max,w.hp+6);});toast(IC('herz','i24')+'Heilkräuter: alle +6');}}
    else if(c.t==='feuer'){runLog('Signalfeuer: Von hier holt euch ein Boot ab.');toast(IC('feuer','i24')+'Fluchtpunkt gefunden');}

}
function checkWipe(){if(S.run.crew.every(w=>w.hp<=0))endRun(false);render();}

  const R=S.run;const got={};

  R.crew.forEach(w=>{
    if(w.hp>0&&ok){if(w.waffe)S.res.waffe++;if(w.ruestung)S.res.ruestung++;}
    else S.crew[w.ci].wounded=now()+10*60e3;

function drawParts(){

    const p=parts[k],t=(T0-p.t0)/p.life;if(t<0)continue;if(t>=1){parts.splice(k,1);continue;}
    if(p.kind==='pop'){
      const y=p.y-t*26,a=t<.15?t/.15:t>.6?1-(t-.6)/.4:1,s=t<.15?.6+t/.15*.4:1;
      ctx.globalAlpha=a;ctx.drawImage(iconC(p.k),p.x-14*s,y-9*s,18*s,18*s);
      ctx.font='700 10px Work Sans, sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.lineWidth=3;ctx.strokeStyle='rgba(34,52,58,.85)';ctx.strokeText(p.txt,p.x+5,y);ctx.fillStyle='#FFF8E6';ctx.fillText(p.txt,p.x+5,y);
      ctx.globalAlpha=1;
    } else if(p.kind==='dust'){
      const tt=t*p.life/1000;ctx.globalAlpha=(1-t)*.7;ctx.fillStyle='#E8DEC6';ctx.beginPath();ctx.arc(p.x+p.vx*tt,p.y+p.vy*tt,3+t*6,0,TAU);ctx.fill();ctx.globalAlpha=1;
    } else {
      const tt=t*p.life/1000,x=p.x+p.vx*tt,y=p.y+p.vy*tt+30*tt*tt,r=3*(1-t)+1;
      ctx.globalAlpha=1-t;ctx.fillStyle='#F4C04E';ctx.save();ctx.translate(x,y);ctx.rotate(p.r+t*4);ctx.beginPath();for(let q=0;q<4;q++){ctx.lineTo(0,-r*2);ctx.rotate(TAU/8);ctx.lineTo(0,-r*.7);ctx.rotate(TAU/8);}ctx.fill();ctx.restore();ctx.globalAlpha=1;
    }

const ptrs=new Map();let drag=null,pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(ptrs.size===1)drag={x:e.offsetX,y:e.offsetY,vx:view.x,vy:view.y,moved:false};
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:view.z};if(drag)drag.moved=true;}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()];zoomTo(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d);return;}
  if(drag){const dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;if(drag.moved){view.x=drag.vx+dx;view.y=drag.vy+dy;}}});
cv.addEventListener('pointerup',e=>{
  if(drag&&!drag.moved&&ptrs.size===1)selectTile(screenToTile(e.offsetX,e.offsetY));
  ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(ptrs.size===0)drag=null;
});
cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);drag=null;pinch=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomTo(view.z*(e.deltaY<0?1.1:.9));},{passive:false});

function battleRound(){

function burst(g,x,y,e,col){const k=e/280;g.save();g.globalAlpha=Math.max(0,1-k);g.strokeStyle=col;g.lineWidth=3;g.lineCap='round';for(let i=0;i<8;i++){const a=i*TAU/8,r1=8+k*14,r2=r1+8;g.beginPath();g.moveTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);g.lineTo(x+Math.cos(a)*r2,y+Math.sin(a)*r2);g.stroke();}g.restore();}

    zoom(){zoomTo(view.z*+el.dataset.z);},
    build(){const k=el.dataset.k,d=B[k];if(!has(d.cost)||!canPlace(k,sel))return;pay(d.cost);const T=S.tiles[sel];if(T.t==='forest')T.t='grass';T.b={type:k,lvl:1,prog:0,run:0};if(d.rec)T.b.recipe=d.rec[0];anim[sel]=T0;dust(sel);derive();renderSheet();},
    upgrade(){const b=S.tiles[sel].b,c=upCost(b);if(!has(c)||b.lvl>=MAXLVL)return;pay(c);b.lvl++;sparks(sel);anim[sel]=T0-250;derive();renderSheet();},
    demolish(){if(!demolishArm){demolishArm=true;renderSheet();return;}const b=S.tiles[sel].b,d=B[b.type];for(const k in d.cost)S.res[k]+=Math.floor(d.cost[k]/2);if(b.run&&b.recipe){const r=RECIPES[b.recipe];for(const k in r.in)S.res[k]+=r.in[k];}dust(sel);S.tiles[sel].b=null;demolishArm=false;derive();renderSheet();},
    recipe(){const b=S.tiles[sel].b;if(b.run){const r=RECIPES[b.recipe||B[b.type].rec[0]];for(const k in r.in)S.res[k]+=r.in[k];}b.recipe=el.dataset.k;b.run=0;b.prog=0;renderSheet();},
    expand(){const c=EXPAND[S.expand];if(!c||!has(c))return;pay(c);S.expand++;S.radius+=1.5;derive();toast(IC('plus','i24')+'Neues Land erschlossen');sel=-1;renderSheet();},
    sell(){const k=el.dataset.k,n=el.dataset.n==='all'?Math.floor(S.res[k]):Math.min(10,Math.floor(S.res[k]));if(n<=0)return;S.res[k]-=n;const c=n*price(k);S.res.muenzen+=c;toast(IC(k,'i24')+'−'+n+' '+IC('muenzen','i24')+'+'+c);render();},
    buy(){const k=el.dataset.k,c=RES[k].p*15;if(S.res.muenzen<c)return;S.res.muenzen-=c;add(k,5);toast(IC(k,'i24')+'+5');render();},
    order(){const j=+el.dataset.j,o=S.orders[j];if(!o||S.res[o.k]<o.a)return;S.res[o.k]-=o.a;S.res.muenzen+=o.rew;S.orders.splice(j,1);fillOrders();toast(IC('truhe','i24')+'Auftrag erledigt '+IC('muenzen','i24')+'+'+o.rew);render();},
    defend(){openBattle();},
    fire(){if(battle&&battle.fire){battle.fire=0;battle.boost=1;el.classList.add('off');}},
    closebattle(){battle=null;$('#modal').hidden=true;render();},
    closemodal(){$('#modal').hidden=true;},
    fps(){S.opt.fps=!S.opt.fps;$('#fps').hidden=!S.opt.fps;showMenu();},
    crew(){const i=+el.dataset.i;if(S.crew[i].wounded>now())return;S.prep.sel[i]=!S.prep.sel[i];render();},
    extra(){S.prep.extra=+el.dataset.n;render();},
    start(){prevHp={};runVis=null;startRun(+el.dataset.d);},
    move(){move(+el.dataset.i);},
    take(){const R=S.run,c=R.cells[R.pos],j=+el.dataset.j;if(R.bag.length>=bagCap())return;R.bag.push(c.loot.splice(j,1)[0]);render();},
    drop(){const R=S.run,j=+el.dataset.j;R.cells[R.pos].loot.push(R.bag.splice(j,1)[0]);render();},
    safe(){const R=S.run,j=+el.dataset.j;if(R.safe)return;R.safe=R.bag.splice(j,1)[0];render();},
    unsafe(){const R=S.run;if(!R.safe||R.bag.length>=bagCap())return;R.bag.push(R.safe);R.safe=null;render();},
    rest(){const R=S.run;if(R.extra<=0)return;R.extra--;R.step++;R.crew.forEach(w=>{if(w.hp>0)w.hp=Math.min(w.max,w.hp+10);});runLog('Rast am Feuer: alle +10.');toast(IC('herz','i24')+'Rast: alle +10');render();},
    extract(){const R=S.run,c=R.cells[R.pos];if(c.t!=='ship'&&c.t!=='feuer')return;endRun(true);save();render(true);},
    closerun(){S.run=null;render(true);},
    menu(){showMenu();},
    reset(){if(!resetArm){resetArm=true;el.textContent='Wirklich? Alles weg';el.classList.remove('alt');el.classList.add('red');return;}
      S=fresh();vill.length=0;derive();fillOrders();rollBoat();save();sel=-1;fitted=false;resize();$('#modal').hidden=true;tab='insel';render(true);}
  };
  if(A[a]){A[a]();save();}
});

/* ---------- Start ---------- */
function boot(){
  document.querySelectorAll('img[data-icon]').forEach(im=>{im.src=iconURL(im.dataset.icon);});
  S=load();let rep=null;
  if(!S)S=fresh();
  else{S.opt=S.opt||{fps:false};derive();const gap=now()-S.t;if(gap>60e3)rep=catchUp(gap);}
  derive();fillOrders();if(!S.boat.until)rollBoat();
  $('#fps').hidden=!S.opt.fps;
  resize();updNight();render();save();
  if(rep&&(Object.keys(rep.gain).length||rep.raids.length))showReport(rep);
  requestAnimationFrame(loop);
  setInterval(()=>{
    const t=now(),dt=(t-S.t)/1000;
    if(dt>60){const r=catchUp(t-S.t);if(Object.keys(r.gain).length||r.raids.length)showReport(r);}
    else{LIVE=true;tick(dt);LIVE=false;S.t=t;}
    for(const i in popAcc){const T=S.tiles[i];if(!T.b||!B[T.b.type].out){delete popAcc[i];continue;}if(popAcc[i]>=3){const n=Math.floor(popAcc[i]);popAt(+i,B[T.b.type].out,n);popAcc[i]-=n;}}
    if(!S.raid.pending&&t>=S.raid.next&&!S.run){S.raid.pending=true;S.raid.since=t;toast(IC('schiff','i24')+'Plünderer in Sicht!');if(tab==='wehr')render();}
    if(S.raid.pending&&!battle&&t-S.raid.since>120e3){autoBattle();if(tab==='wehr')render();}
    if(tab==='handel'&&t>S.boat.until)render();
    document.querySelectorAll('[data-wound]').forEach(el=>{const c=S.crew[+el.dataset.wound];if(c.wounded<=t)render();else el.textContent=fmtT(c.wounded-t);});
    refresh();
  },1000);
  setInterval(save,5000);
  setInterval(updNight,60e3);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
  window.addEventListener('pagehide',save);
  new ResizeObserver(()=>resize()).observe($('#stage'));
}
boot();
})();
</script>
